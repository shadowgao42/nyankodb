<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --surface: #111720;
      --surface-2: #171f29;
      --line: #344252;
      --line-strong: #526274;
      --text: #f4f7fb;
      --muted: #a5b1c1;
      --accent: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      background:
        linear-gradient(135deg, transparent 0 48%, rgba(255,255,255,.025) 48% 48.2%, transparent 48.2% 100%),
        var(--bg);
    }

    .page {
      width: min(100% - 32px, 1040px);
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .brand {
      display: inline-block;
      margin: 0 0 18px;
      color: var(--text);
      font-size: clamp(24px, 4vw, 31px);
      font-weight: 900;
      letter-spacing: -.06em;
      text-decoration: none;
    }

    .brand:hover { color: #fff; }
    .brand .db { color: var(--accent); }

    .search-card,
    .update-news-card,
    .notice-card {
      border: 1px solid var(--line);
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(23,31,41,.98), rgba(14,20,28,.98));
      box-shadow: var(--shadow);
    }

    .search-card { padding: 18px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(22px, 3vw, 29px); letter-spacing: -.045em; }
    h2 { font-size: 19px; letter-spacing: -.04em; }
    .intro { margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 700; }

    .search-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .search-nav {
      display: flex;
      flex: 0 0 auto;
      gap: 7px;
    }

    .search-nav a,
    button {
      min-height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--text);
      background: #303a47;
      font: inherit;
      font-weight: 900;
    }

    .search-nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      text-decoration: none;
      white-space: nowrap;
    }

    .search-nav a:hover,
    button:hover { background: #374657; }

    form { display: flex; gap: 9px; margin-top: 16px; }

    input {
      width: 100%;
      height: 42px;
      padding: 8px 13px;
      border: 1px solid #4d5a69;
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: #0c1118;
      font: inherit;
    }

    input:focus {
      border-color: #788697;
      box-shadow: 0 0 0 2px rgba(145,158,173,.18);
    }

    button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 8px 16px;
      cursor: pointer;
    }

    .search-status {
      min-height: 18px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .search-results {
      display: grid;
      max-height: min(72vh, 920px);
      margin-top: 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .search-result {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      min-width: 0;
      min-height: 82px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      text-decoration: none;
    }

    .search-result:hover {
      background: #263240;
      box-shadow: inset 3px 0 var(--accent);
    }

    .search-result img {
      display: block;
      width: 78px;
      height: 60px;
      object-fit: contain;
      object-position: center;
      background: transparent;
    }

    .search-result-copy { min-width: 0; }

    .result-name {
      display: block;
      overflow: hidden;
      color: #fff;
      font-size: 14px;
      font-weight: 950;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-form {
      display: block;
      margin-top: 5px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .update-news-card,
    .notice-card { margin-top: 24px; overflow: hidden; }

    .update-news-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .update-news-link:hover .notice-heading,
    .update-news-link:focus-visible .notice-heading {
      background: rgba(255,255,255,.035);
    }

    .update-news-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .update-news-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 77px;
      padding: 12px 20px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .update-news-icon {
      display: block;
      flex: 0 0 auto;
      width: 62px;
      height: 49px;
      object-fit: contain;
      image-rendering: auto;
    }

    .update-news-empty {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .notice-heading {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }

    .notice-note { padding: 12px 20px 0; color: var(--muted); font-size: 13px; }

    iframe {
      display: block;
      width: 100%;
      height: min(74vh, 760px);
      min-height: 480px;
      margin-top: 12px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 650px) {
      .page { width: min(100% - 20px, 1040px); padding-top: 18px; }
      .search-card { padding: 15px; }
      .search-header { display: grid; }
      .search-nav { width: 100%; }
      .search-nav a { flex: 1 1 0; }
      .intro { font-size: 13px; }
      form { gap: 6px; }
      button { padding: 0 13px; }
      .notice-heading { padding: 15px 16px; }
      .notice-note { padding: 11px 16px 0; }
      .update-news-icons { padding-inline: 16px; }
      iframe { min-height: 520px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="./" aria-label="냥코DB 홈">냥코<span class="db">DB</span></a>

    <section class="search-card" aria-labelledby="unit-search-title">
      <div class="search-header">
        <div>
          <h1 id="unit-search-title">검색</h1>
          <p class="intro">유닛 또는 적 이름의 일부를 입력해 원하는 스펙으로 이동할 수 있습니다.</p>
        </div>
        <nav class="search-nav" aria-label="검색 도구">
          <a href="unit/">유닛 검색</a>
          <a href="enemy/">적 검색</a>
        </nav>
      </div>
      <form id="unit-search-form" role="search">
        <input id="unit-search-input" type="search" autocomplete="off"
               placeholder="이름 입력" aria-label="유닛 또는 적 이름">
        <button type="submit">검색</button>
      </form>
      <p class="search-status" id="search-status" aria-live="polite">유닛 목록을 불러오는 중입니다.</p>
      <div class="search-results" id="search-results" role="listbox" aria-label="검색 결과"></div>
    </section>

    <section class="update-news-card" aria-labelledby="update-news-title" hidden>
      <a class="update-news-link" id="update-news-link" href="update/" aria-label="최신 업데이트 소식 보기">
        <div class="notice-heading"><h2 id="update-news-title">업데이트 소식</h2></div>
        <div class="update-news-icons" id="update-news-icons" aria-live="polite"></div>
      </a>
    </section>

    <section class="notice-card" aria-labelledby="notice-title">
      <div class="notice-heading"><h2 id="notice-title">공식 공지</h2></div>
      <p class="notice-note">냥코 대전쟁 공식 공지입니다.</p>
      <iframe id="notice-frame" title="냥코 대전쟁 공식 공지" loading="lazy"
              referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <script src="catalog.js"></script>
  <script>
    (() => {
      "use strict";
      const NOTICE_URL = "https://nyanko-announcement.ponosgames.com/v1/notices?platform=google&clientVersion=100300&countryCode=ko&clearedStageJapan=100&clearedStageFuture=100&clearedUniverse=100&timeDifference=700";
      const input = document.getElementById("unit-search-input");
      const form = document.getElementById("unit-search-form");
      const status = document.getElementById("search-status");
      const results = document.getElementById("search-results");
      const entries = window.NYANKODB_SEARCH_CATALOG?.entries || [];
      const updateNews = document.querySelector(".update-news-card");
      const updateNewsLink = document.getElementById("update-news-link");
      const updateNewsIcons = document.getElementById("update-news-icons");

      document.getElementById("notice-frame").src = NOTICE_URL;

      async function latestUpdatePage() {
        // GitHub Pages cannot enumerate a directory.  The repository API lets
        // the page select the numerically latest update HTML without copying
        // any update data into the main page.
        try {
          const response = await fetch(
            "https://api.github.com/repos/shadowgao42/nyankodb/contents/update",
            { headers: { Accept: "application/vnd.github+json" } },
          );
          if (!response.ok) throw new Error("update directory unavailable");
          const files = await response.json();
          const latest = files
            .filter((file) => /^\d+\.html$/.test(String(file.name || "")))
            .sort((left, right) => Number(right.name.replace(/\.html$/, "")) - Number(left.name.replace(/\.html$/, "")))[0];
          if (latest?.name) return `update/${latest.name}`;
        } catch {
          // Local/offline viewing uses the same generated pointer as a
          // fallback; the icon information is still parsed from that HTML.
        }
        const response = await fetch("update/latest.json");
        if (!response.ok) throw new Error("latest update unavailable");
        const data = await response.json();
        if (!/^\d+\.html$/.test(String(data.page || ""))) {
          throw new Error("invalid latest update pointer");
        }
        return `update/${data.page}`;
      }

      async function renderLatestUpdateNews() {
        try {
          const page = await latestUpdatePage();
          const response = await fetch(page);
          if (!response.ok) throw new Error("update page unavailable");
          const document = new DOMParser().parseFromString(
            await response.text(),
            "text/html",
          );
          const iconSources = [...document.querySelectorAll(
            ".update-section .update-grid .update-card > img, .update-section .update-grid .update-card .update-card-link > img",
          )]
            .map((image) => image.getAttribute("src"))
            .filter(Boolean);
          if (!iconSources.length) return;

          updateNewsLink.href = page;
          updateNewsIcons.replaceChildren(...iconSources.map((source) => {
            const image = new Image();
            image.className = "update-news-icon";
            image.src = new URL(source, new URL(page, window.location.href)).href;
            image.alt = "";
            image.loading = "lazy";
            return image;
          }));
          updateNews.hidden = false;
        } catch {
          // The main search and official-notice areas remain available even
          // when an update page is temporarily unavailable.
        }
      }

      renderLatestUpdateNews();
      try {
        window.sessionStorage.setItem("nyanko-db:last-page:v1", window.location.pathname);
      } catch {
        // 저장소가 차단되어도 검색은 정상적으로 동작합니다.
      }

      const compact = value => String(value || "").toLowerCase()
        .replace(/[\s\p{P}\p{S}_]/gu, "");

      const isSubsequence = (needle, haystack) => {
        let position = 0;
        for (const letter of needle) {
          position = haystack.indexOf(letter, position);
          if (position < 0) return false;
          position += 1;
        }
        return true;
      };

      const containsEveryLetter = (needle, haystack) => {
        const remaining = new Map();
        for (const letter of haystack) {
          remaining.set(letter, (remaining.get(letter) || 0) + 1);
        }
        for (const letter of needle) {
          const count = remaining.get(letter) || 0;
          if (count < 1) return false;
          remaining.set(letter, count - 1);
        }
        return true;
      };

      function matchingEntries(query) {
        const key = compact(query);
        if (!key) return [];
        if (/^\d{1,3}$/.test(key)) {
          const id = Number(key);
          return entries.filter(entry => Number(entry.id) === id);
        }
        return entries
          .map(entry => {
            const name = compact(entry.name);
            let rank = 99;
            if (name === key) rank = 0;
            else if (name.includes(key)) rank = 1;
            else if (isSubsequence(key, name)) rank = 2;
            else if (containsEveryLetter(key, name)) rank = 3;
            return { entry, rank };
          })
          .filter(item => item.rank < 99)
          .sort((a, b) => a.rank - b.rank
            || Number(a.entry.id) - Number(b.entry.id)
            || Number(a.entry.form) - Number(b.entry.form))
          .map(item => item.entry);
      }

      function entryUrl(entry) {
        const id = String(entry.id).padStart(3, "0");
        return entry.kind === "enemy"
          ? `enemy/enemy${id}.html`
          : `unit/unit${id}.html?form=${entry.form || 1}`;
      }

      function render(query) {
        const matches = matchingEntries(query);
        results.replaceChildren();
        if (!compact(query)) {
          status.textContent = entries.length
            ? "유닛 또는 적 이름을 입력해 검색하세요."
            : "검색 목록을 불러오지 못했습니다.";
          return matches;
        }
        if (!matches.length) {
          status.textContent = "일치하는 결과가 없습니다.";
          return matches;
        }
        status.textContent = `${matches.length}개의 결과`;
        const fragment = document.createDocumentFragment();
        matches.forEach(entry => {
          const link = document.createElement("a");
          link.className = "search-result";
          link.href = entryUrl(entry);
          link.setAttribute("role", "option");
          const image = document.createElement("img");
          image.src = entry.icon || "";
          image.alt = "";
          image.loading = "lazy";
          const name = document.createElement("span");
          name.className = "result-name";
          name.textContent = entry.name;
          const formLabel = document.createElement("span");
          formLabel.className = "result-form";
          formLabel.textContent = entry.kind === "enemy"
            ? `ENEMY ${String(entry.id).padStart(3, "0")}`
            : `UNIT ${String(entry.id).padStart(3, "0")}-${entry.form || 1}`;
          const copy = document.createElement("span");
          copy.className = "search-result-copy";
          copy.append(name, formLabel);
          link.append(image, copy);
          fragment.append(link);
        });
        results.append(fragment);
        return matches;
      }

      input.addEventListener("input", () => render(input.value));
      form.addEventListener("submit", event => {
        event.preventDefault();
        const matches = render(input.value);
        if (matches.length) window.location.href = entryUrl(matches[0]);
      });

      status.textContent = entries.length
        ? "유닛 또는 적 이름을 입력해 검색하세요."
        : "검색 목록을 불러오지 못했습니다.";
    })();
  </script>
</body>
</html>
