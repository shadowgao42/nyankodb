<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>냥코DB</title>
  <link rel="stylesheet" href="list-page.css">
  <style>
    .home-page .results-panel { flex: none; }
    .home-page .results-panel > .section-heading { gap:14px; min-width:0; }
    .update-news-link { color:inherit; text-decoration:none; }
    .update-news-link:hover .section-heading { background:rgba(255,255,255,.035); }
    .update-news-link:focus-visible { outline:2px solid var(--accent-2); outline-offset:3px; }
    .update-news-icons { display:flex; align-items:center; gap:8px; min-height:77px; padding:12px 18px; overflow-x:auto; scrollbar-width:thin; }
    .update-news-icon { display:block; flex:none; width:78px; height:60px; object-fit:contain; image-rendering:pixelated; }
    [hidden] { display: none !important; }
    .notice-carousel { display: flex; flex-direction: column; padding: 18px; }
    .notice-stage { order: 1; position: relative; aspect-ratio: 3.125; overflow: hidden; touch-action: pan-y; }
    .notice-slide { position: absolute; top: 50%; left: 50%; width: 64%; display: block; color: var(--text); text-decoration: none; transform: translate(-50%, -50%); }
    .notice-stage.is-moving .notice-slide { transition: left 360ms ease, transform 360ms ease, opacity 360ms ease; }
    .notice-slide img { display: block; width: 100%; aspect-ratio: 2; object-fit: contain; border-radius: 9px; -webkit-user-drag: none; user-select: none; }
    .notice-caption { order: 2; margin: 18px 0; text-align: center; font-size: 18px; line-height: 1.5; }
    .notice-controls { order: 3; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .notice-controls button { min-width: 42px; min-height: 42px; padding: 9px 18px; font-size: 14px; font-weight: 900; color: var(--text); cursor: pointer; border: 1px solid #425267; border-radius: 10px; background: #202a37; }
    .notice-controls button:disabled { opacity: .5; cursor: default; }
    .notice-controls button:focus-visible, .notice-slide:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
    .notice-official-link { color: var(--text); }
    .social-logo-link { display:inline-flex; align-items:center; justify-content:center; flex:none; width:56px; height:56px; padding:8px; text-decoration:none; }
    .social-logo-link img { display:block; width:40px; height:40px; object-fit:contain; }
    .social-logo-link .official-x-logo { filter:invert(1); }
    .social-logo-link:focus-visible { outline:2px solid var(--accent-2); outline-offset:3px; }
    .social-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,370px),1fr)); gap:12px; margin-top:12px; }
    .home-page .social-card { min-width:0; margin-top:0; }
    .home-page .social-grid .social-card > .section-heading { flex-direction:row; align-items:center; gap:14px; }
    .social-content { min-width:0; padding:16px 18px; }
    .social-embed { display:block; width:100%; max-width:100%; height:600px; border:0; margin:0; }
    .social-status, .social-profile-link { color:var(--muted); font-size:13px; font-weight:700; line-height:1.6; }
    .social-profile-link { display:inline-block; margin-top:12px; color:var(--text); }
    .social-profile-link:focus-visible { outline:2px solid var(--accent-2); outline-offset:3px; }
    .x-feed { max-width:100%; max-height:600px; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
    .x-feed iframe { max-width:100% !important; }
    .x-post { padding:12px 0; border-bottom:1px solid var(--line); }
    .x-post-author { color:var(--text); font-size:14px; font-weight:900; }
    .x-post-text { margin-top:8px; white-space:pre-line; overflow-wrap:anywhere; color:var(--text); font-size:13px; line-height:1.6; }
    .x-post-date { display:block; margin-top:8px; color:var(--muted); font-size:12px; }
    .x-post a:focus-visible { outline:2px solid var(--accent-2); outline-offset:3px; }
    .shop-updates { display:grid; grid-template-columns:minmax(0,1fr); }
    .shop-updates .item-card { border-right:0; }
    .shop-updates img { image-rendering:auto; }
    .shop-title { display:block; overflow-wrap:anywhere; font-size:14px; font-weight:900; }
    .shop-price { display:block; margin-top:5px; color:var(--muted); font-size:12px; font-weight:700; }

    .notice-note { padding: 12px 20px 0; color: var(--muted); font-size: 13px; }

    #notice-frame {
      display: block;
      width: 100%;
      height: min(74vh, 760px);
      min-height: 480px;
      margin-top: 12px;
      border: 0;
      background: #fff;
    }

    @media (max-width:760px) {
      .social-grid { grid-template-columns:minmax(0,1fr); }
      .social-content { padding-inline:15px; }
      .notice-carousel { padding:15px; }
      .notice-caption { font-size:16px; margin:12px 0; }
      .notice-note { padding-inline:15px; }
      .update-news-icons { padding-inline:15px; }
    }
    @media (max-width:500px) {
      .home-page .results-panel > .section-heading { align-items:flex-start; flex-direction:column; gap:5px; }
      .update-news-icon { width:58px; height:48px; }
    }
  </style>
  <link rel="stylesheet" href="gnb.css">
</head>
<body>
  <main class="page home-page">
    <header data-nyanko-gnb data-search-prefix="unitSearch"></header>
    <script src="gnb.js"></script>
    <a class="update-news-card results-panel update-news-link" id="update-news-link" href="update/" aria-labelledby="update-news-title" hidden>
        <div class="notice-heading section-heading"><h2 id="update-news-title">업데이트 소식</h2></div>
        <div class="update-news-icons" id="update-news-icons" aria-live="polite"></div>
    </a>

    <section class="notice-card results-panel" aria-labelledby="notice-title">
      <div class="notice-heading section-heading"><h2 id="notice-title">공식 공지</h2></div>
      <div class="notice-carousel" id="notice-carousel" hidden aria-roledescription="캐러셀" aria-label="공식 공지 배너">
        <div class="notice-controls">
          <button id="notice-prev" type="button" aria-label="이전 공지">‹</button>
          <span id="notice-count" aria-live="off"></span>
          <button id="notice-next" type="button" aria-label="다음 공지">›</button>
        </div>
        <div class="notice-stage" id="notice-stage"></div>
        <h3 class="notice-caption" id="notice-caption"></h3>
      </div>
      <p class="notice-note" id="notice-fallback"><a class="notice-official-link" id="notice-official-link" target="_blank" rel="noopener noreferrer">공식 공지 보기</a></p>
      <iframe id="notice-frame" title="냥코 대전쟁 공식 공지" loading="lazy"
              referrerpolicy="no-referrer"></iframe>
    </section>
    <div class="social-grid">
      <section class="social-card results-panel" aria-labelledby="instagram-title">
        <div class="section-heading"><h2 id="instagram-title">공식 인스타그램</h2><a class="social-logo-link" href="https://www.instagram.com/insta_nyanko/" target="_blank" rel="noopener noreferrer" aria-label="일본판 공식 인스타그램"><img src="img/social/instagram.webp" alt="" width="40" height="40"></a></div>
        <div class="social-content">
          <iframe class="social-embed" src="https://www.instagram.com/insta_nyanko/embed/" title="일본판 공식 인스타그램 게시물" loading="lazy" referrerpolicy="no-referrer"></iframe>
          <a class="social-profile-link" href="https://www.instagram.com/insta_nyanko/" target="_blank" rel="noopener noreferrer">인스타그램에서 보기 →</a>
        </div>
      </section>
      <section class="social-card results-panel" aria-labelledby="x-title">
        <div class="section-heading"><h2 id="x-title">공식 X(트위터)</h2><a class="social-logo-link" href="https://twitter.com/PONOS_GAME" target="_blank" rel="noopener noreferrer" aria-label="일본판 공식 X(트위터)"><img class="official-x-logo" src="img/social/x.webp" alt="" width="40" height="40"></a></div>
        <div class="social-content">
          <p class="social-status" id="x-status" role="status">게시물을 불러오는 중입니다.</p>
          <div class="x-feed" id="x-feed"></div>
          <a class="social-profile-link" href="https://twitter.com/PONOS_GAME" target="_blank" rel="noopener noreferrer">X에서 보기 →</a>
        </div>
      </section>
      <section class="social-card results-panel" aria-labelledby="shop-title">
        <div class="section-heading"><h2 id="shop-title">냥코대상점</h2><a class="social-logo-link" href="https://www.nyanko-daishoten.jp/" target="_blank" rel="noopener noreferrer" aria-label="냥코대상점 일본 공식 온라인 상점"><img src="img/social/shop.png" alt="" width="40" height="40"></a></div>
        <p class="social-content social-status" id="shop-status" role="status">신상품을 불러오는 중입니다.</p>
        <div class="shop-updates" id="shop-updates"></div>
        <div class="social-content"><a class="social-profile-link" href="https://www.nyanko-daishoten.jp/" target="_blank" rel="noopener noreferrer">냥코대상점에서 보기 →</a></div>
      </section>
    </div>
  </main>

  <script src="catalog.js"></script>
  <script src="search.js" defer></script>
  <script src="home-notices.js" defer></script>
  <script src="home-social.js" defer></script>
  <script>
    (() => {
      "use strict";
      const updateNews = document.querySelector(".update-news-card");
      const updateNewsLink = document.getElementById("update-news-link");
      const updateNewsIcons = document.getElementById("update-news-icons");

      async function latestUpdatePage() {
        // Version filenames such as 150501 and 1506 cannot be ordered as
        // plain integers. The generated pointer is the source of truth.
        const response = await fetch("update/latest.json");
        if (!response.ok) throw new Error("latest update unavailable");
        const data = await response.json();
        if (!/^\d+\.html$/.test(String(data.page || ""))) {
          throw new Error("invalid latest update pointer");
        }
        return `update/${data.page}`;
      }

      async function renderLatestUpdateNews() {
        try {
          const page = await latestUpdatePage();
          const response = await fetch(page);
          if (!response.ok) throw new Error("update page unavailable");
          const document = new DOMParser().parseFromString(
            await response.text(),
            "text/html",
          );
          const iconSources = [...document.querySelectorAll(
            ".update-section .update-grid .update-card > img, .update-section .update-grid .update-card .update-card-link > img",
          )]
            .map((image) => image.getAttribute("src"))
            .filter(Boolean);
          if (!iconSources.length) return;

          updateNewsLink.href = page;
          updateNewsIcons.replaceChildren(...iconSources.map((source) => {
            const image = new Image();
            image.className = "update-news-icon";
            image.src = new URL(source, new URL(page, window.location.href)).href;
            image.alt = "";
            image.loading = "lazy";
            return image;
          }));
          updateNews.hidden = false;
        } catch {
          // The main search and official-notice areas remain available even
          // when an update page is temporarily unavailable.
        }
      }

      renderLatestUpdateNews();
      try {
        window.sessionStorage.setItem("nyanko-db:last-page:v1", window.location.pathname);
      } catch {
        // 저장소가 차단되어도 검색은 정상적으로 동작합니다.
      }

    })();
  </script>
  <script src="analytics-bundle.js"></script>
</body>
</html>
