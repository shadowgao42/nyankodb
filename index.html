<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --surface: #111720;
      --surface-2: #171f29;
      --line: #344252;
      --text: #f4f7fb;
      --muted: #a5b1c1;
      --focus: #aeb9c7;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }

    body {
      min-width: 0;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      background:
        linear-gradient(135deg, transparent 0 48%, rgba(255,255,255,.025) 48% 48.2%, transparent 48.2% 100%),
        var(--bg);
    }

    .page { width: min(100% - 32px, 1040px); margin: 0 auto; padding: 28px 0 44px; }

    .brand {
      display: inline-block;
      margin: 0 0 18px;
      color: var(--text);
      font-size: clamp(24px, 4vw, 31px);
      font-weight: 900;
      letter-spacing: -.06em;
      text-decoration: none;
    }

    .brand:hover { color: #fff; }
    .brand .db { color: #ffad3d; }

    .search-card,
    .notice-card {
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(23,31,41,.98), rgba(14,20,28,.98));
      box-shadow: var(--shadow);
    }

    .search-card { padding: clamp(18px, 3vw, 28px); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(21px, 3vw, 28px); letter-spacing: -.045em; }
    .intro { margin-top: 8px; color: var(--muted); font-size: 14px; }

    form { display: flex; gap: 8px; margin-top: 18px; }

    input,
    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      font: inherit;
    }

    input { width: 100%; padding: 0 14px; outline: none; background: #0c1118; }
    input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px rgba(174,185,199,.18); }
    button { flex: 0 0 auto; padding: 0 18px; cursor: pointer; background: #2b3746; font-weight: 800; }
    button:hover { background: #374657; }

    .search-status { min-height: 20px; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .search-results {
      display: grid;
      max-height: min(62vh, 620px);
      margin-top: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-top: 1px solid var(--line);
      scrollbar-width: thin;
    }

    .search-result {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 8px 4px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      text-decoration: none;
    }

    .search-result:hover { background: rgba(255,255,255,.055); }

    .search-result img {
      display: block;
      width: 46px;
      height: 38px;
      object-fit: contain;
      object-position: center;
      background: #fff;
    }

    .result-name { overflow: hidden; font-size: 15px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .result-form { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .notice-card { margin-top: 24px; overflow: hidden; }

    .notice-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }

    h2 { font-size: 19px; letter-spacing: -.04em; }
    .notice-note { padding: 12px 20px 0; color: var(--muted); font-size: 13px; }

    iframe {
      display: block;
      width: 100%;
      height: min(74vh, 760px);
      min-height: 480px;
      margin-top: 12px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 1040px); padding-top: 18px; }
      .search-card { padding: 16px; }
      .intro { font-size: 13px; }
      form { gap: 6px; }
      button { padding: 0 13px; }
      .notice-heading { padding: 15px 16px; }
      .notice-note { padding: 11px 16px 0; }
      iframe { min-height: 520px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="index.html" aria-label="냥코DB 홈">냥코<span class="db">DB</span></a>

    <section class="search-card" aria-labelledby="unit-search-title">
      <h1 id="unit-search-title">유닛 검색</h1>
      <p class="intro">유닛 이름의 일부를 입력해 찾을 수 있습니다.</p>
      <form id="unit-search-form" role="search">
        <input id="unit-search-input" type="search" autocomplete="off" placeholder="유닛 이름 입력" aria-label="유닛 이름">
        <button type="submit">검색</button>
      </form>
      <p class="search-status" id="search-status" aria-live="polite">유닛 목록을 불러오는 중입니다.</p>
      <div class="search-results" id="search-results" role="listbox" aria-label="검색 결과"></div>
    </section>

    <section class="notice-card" aria-labelledby="notice-title">
      <div class="notice-heading">
        <h2 id="notice-title">공식 공지</h2>
      </div>
      <p class="notice-note">냥코 대전쟁 공식 공지입니다.</p>
      <iframe id="notice-frame" title="냥코 대전쟁 공식 공지" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <script>
    (() => {
      const CATALOG_PAGE = "unit/unit496.html";
      const NOTICE_URL = "https://nyanko-announcement.ponosgames.com/v1/notices?platform=google&clientVersion=100300&countryCode=ko&clearedStageJapan=100&clearedStageFuture=100&clearedUniverse=100&timeDifference=700";
      const input = document.getElementById("unit-search-input");
      const form = document.getElementById("unit-search-form");
      const status = document.getElementById("search-status");
      const results = document.getElementById("search-results");
      const noticeFrame = document.getElementById("notice-frame");
      let entries = [];

      noticeFrame.src = NOTICE_URL;

      const compact = value => String(value || "").toLowerCase().replace(/[\s\p{P}\p{S}_]/gu, "");
      const isSubsequence = (needle, haystack) => {
        let position = 0;
        for (const letter of needle) {
          position = haystack.indexOf(letter, position);
          if (position < 0) return false;
          position += 1;
        }
        return true;
      };
      const containsEveryLetter = (needle, haystack) => {
        const remaining = new Map();
        for (const letter of haystack) {
          remaining.set(letter, (remaining.get(letter) || 0) + 1);
        }
        for (const letter of needle) {
          const count = remaining.get(letter) || 0;
          if (count < 1) return false;
          remaining.set(letter, count - 1);
        }
        return true;
      };

      function matchingEntries(query) {
        const key = compact(query);
        if (!key) return [];
        if (/^\d{1,3}$/.test(key)) {
          const id = Number(key);
          return entries.filter(entry => Number(entry.id) === id);
        }
        return entries
          .map(entry => {
            const name = compact(entry.name);
            let rank = 99;
            if (name === key) rank = 0;
            else if (name.includes(key)) rank = 1;
            else if (isSubsequence(key, name)) rank = 2;
            else if (containsEveryLetter(key, name)) rank = 3;
            return { entry, rank };
          })
          .filter(item => item.rank < 99)
          .sort((a, b) => a.rank - b.rank || Number(a.entry.id) - Number(b.entry.id) || Number(a.entry.form) - Number(b.entry.form))
          .map(item => item.entry);
      }

      function unitUrl(id) {
        return `unit/unit${String(id).padStart(3, "0")}.html`;
      }

      function render(query) {
        const matches = matchingEntries(query);
        results.replaceChildren();
        if (!compact(query)) {
          status.textContent = entries.length ? "유닛 이름을 입력해 검색하세요." : "유닛 목록을 불러오는 중입니다.";
          return matches;
        }
        if (!matches.length) {
          status.textContent = "일치하는 유닛이 없습니다.";
          return matches;
        }
        status.textContent = `${matches.length}개의 유닛`;
        const fragment = document.createDocumentFragment();
        matches.forEach(entry => {
          const link = document.createElement("a");
          link.className = "search-result";
          link.href = unitUrl(entry.id);
          link.setAttribute("role", "option");
          const image = document.createElement("img");
          image.src = String(entry.icon || "").replace(/^\.\.\//, "");
          image.alt = "";
          image.loading = "lazy";
          const name = document.createElement("span");
          name.className = "result-name";
          name.textContent = entry.name;
          const formLabel = document.createElement("span");
          formLabel.className = "result-form";
          formLabel.textContent = `${String(entry.id).padStart(3, "0")}-${entry.form || 1}`;
          link.append(image, name, formLabel);
          fragment.append(link);
        });
        results.append(fragment);
        return matches;
      }

      async function loadCatalog() {
        try {
          const source = await fetch(CATALOG_PAGE, { cache: "force-cache" }).then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          });
          const startMarker = "/* UNIT_NAME_SEARCH_INDEX_START */";
          const endMarker = "/* UNIT_NAME_SEARCH_INDEX_END */";
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          const declaration = "const unitSearchIndex = ";
          const declarationStart = source.indexOf(declaration, start);
          const dataStart = declarationStart + declaration.length;
          if (start < 0 || end < 0 || declarationStart < 0) throw new Error("검색 목록을 찾을 수 없습니다.");
          const json = source.slice(dataStart, source.indexOf(";", dataStart));
          entries = JSON.parse(json);
          status.textContent = "유닛 이름을 입력해 검색하세요.";
          if (input.value) render(input.value);
        } catch (error) {
          console.error(error);
          status.textContent = "유닛 목록을 불러오지 못했습니다.";
        }
      }

      input.addEventListener("input", () => render(input.value));
      form.addEventListener("submit", event => {
        event.preventDefault();
        const matches = render(input.value);
        if (matches.length) window.location.href = unitUrl(matches[0].id);
      });
      loadCatalog();
    })();
  </script>
</body>
</html>
