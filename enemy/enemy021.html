    /* Keep the enemy calculator on the same visual system as the unit calculator. */
    :root {
      --surface-2: #171f29;
      --line: #293645;
      --muted: #94a2b6;
      --accent-2: #ffad3d;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    body {
      min-height: 143vh;
      overflow-x: hidden;
      zoom: .7;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 74, 32, .22), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.035) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
    }
    .page { width: min(1220px, calc(100% - 36px)); padding: 24px 0 38px; }

    .treasure-settings {
      margin-bottom: 10px;
      border-color: var(--line);
      background: rgba(14, 19, 26, .92);
    }
    .treasure-settings summary {
      min-height: 52px;
      padding: 9px 18px;
      color: #dce3ed;
      font-size: 16px;
      font-weight: 900;
    }
    .summary-actions { display: inline-flex; }
    .soft-button, .toggle-label {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 12px;
      color: #dce3ed;
    }
    .soft-button:hover, .soft-button:focus-visible {
      border-color: rgba(255,255,255,.42);
      background: rgba(255,255,255,.12);
      outline: none;
    }
    .soft-button:disabled {
      color: #707d8e;
      cursor: default;
      opacity: .62;
    }
    .settings-panel { padding: 0 18px 16px; }
    .category-tabs { gap: 6px; padding: 12px 0 10px; scrollbar-width: thin; }
    .category-tab { padding: 7px 12px; font-size: 12px; }
    .category-tab[aria-pressed="true"] {
      border-color: rgba(255, 173, 61, .5);
      background: rgba(255, 173, 61, .14);
    }
    .treasure-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .treasure-card {
      container-name: treasure-card;
      container-type: inline-size;
      padding: 10px;
      background: var(--surface-2);
    }
    .treasure-head {
      grid-template-columns: 148px minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 9px;
    }
    .treasure-main { width: 148px; height: 58px; border-radius: 8px; object-fit: cover; }
    .treasure-note { margin:0 0 10px; color:var(--muted); font-size:11px; font-weight:700; }
    .treasure-card-title { min-width:0; }
    .treasure-name { margin:0; overflow:hidden; font-size:15px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .treasure-desc { margin:4px 0 0; font-size:10px; font-weight:700; }
    .treasure-total { margin-top:0; color:var(--accent-text); font-size:15px; font-weight:950; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .chapters { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:0; }
    .chapter { padding: 7px; border-color: rgba(255,255,255,.08); background: rgba(8,12,18,.5); }
    .chapters .chapter:last-child { grid-column:auto; }
    .chapter-label { display:flex; align-items:center; justify-content:space-between; gap:5px; font-size:10px; }
    .treasure-chapter-percent { color:var(--accent-text); font-variant-numeric:tabular-nums; }
    .slots { grid-template-columns: repeat(4, 40px); gap: 5px; }
    .slot {
      width: 40px;
      height: 40px;
      aspect-ratio: auto;
      padding: 0;
      border-color: #3a4859;
      border-radius: 8px;
      background: #0b1017;
      color: #667487;
    }
    .slot img { width: 36px; height: 36px; }
    .slot:hover, .slot:focus-visible {
      border-color: #71839a;
      box-shadow: 0 0 0 2px rgba(255,173,61,.18);
      outline: none;
    }
    .slot::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      z-index: 45;
      width: max-content;
      max-width: min(240px, calc(100vw - 44px));
      padding: 8px 10px;
      border: 1px solid #48586c;
      border-radius: 9px;
      color: #fff;
      background: #080c12;
      box-shadow: 0 8px 24px rgba(0,0,0,.38);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.5;
      text-align: left;
      white-space: pre-line;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 5px);
      transition: opacity .14s ease, transform .14s ease;
    }
    .slot:nth-child(4n + 1)::after { left:0; transform:translate(0,5px); }
    .slot:nth-child(4n)::after { right:0; left:auto; transform:translate(0,5px); }
    .slot:hover::after, .slot:focus-visible::after { opacity:1; transform:translate(-50%,0); }
    .slot:nth-child(4n + 1):hover::after, .slot:nth-child(4n + 1):focus-visible::after, .slot:nth-child(4n):hover::after, .slot:nth-child(4n):focus-visible::after { transform:translate(0,0); }
    .passive-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .passive-card {
      min-width: 0;
      padding: 14px;
      border: 1px solid #2d3948;
      border-radius: 14px;
      background: var(--surface-2);
    }
    .passive-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .passive-card-header h3 { margin: 0; font-size: 16px; }
    .passive-current-level {
      color: var(--accent-text);
      font-size: 14px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .passive-effect {
      margin: -4px 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .passive-level-controls { display: grid; gap: 8px; }
    .passive-level-row {
      display: grid;
      grid-template-columns: 78px minmax(80px, 1fr) 58px;
      align-items: center;
      gap: 8px;
    }
    .passive-level-row label {
      color: #dce3ed;
      font-size: 11px;
      font-weight: 850;
    }
    .passive-level-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .passive-level-row input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 6px 7px;
      border: 1px solid #3a4859;
      border-radius: 8px;
      color: #fff;
      background: #0b1017;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .treasure-empty { font-size: 16px; font-weight: 900; }
    .treasure-empty-category {
      padding: 24px 14px;
      border: 1px dashed #344254;
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .hero {
      grid-template-columns: clamp(112px, 20vw, 260px) minmax(0, 1fr);
      min-height: 238px;
      border-color: var(--line);
      background: rgba(14, 19, 26, .9);
      box-shadow: var(--shadow);
    }
    .portrait {
      min-height: 238px;
      overflow: hidden;
      padding: 0;

function enemyShieldHealthState(stats=enemyCurrentStatValues()){
  const barrierAbility=enemyAttackAbility('barrier');
  const barrierEnabled=!!barrierAbility&&enemyActiveHealthEffectKeys.has('barrier');
  // Enemy magnification does not affect barrier durability.  Demon shields,
  // on the other hand, are scaled with the enemy's normal statistics.
  const barrier=barrierEnabled?Math.max(0,Number(barrierAbility.hitpoints)||0):0;
  const shieldAbility=enemyAttackAbility('shield');
  const enabled=!!shieldAbility&&enemyActiveHealthEffectKeys.has('shield');
  const shield=enabled?enemyScaleShield(Math.max(0,Number(shieldAbility.hitpoints)||0)):0;
  const regeneration=Math.max(0,Math.min(100,Number(shieldAbility?.regeneration_percent)||0));
  const regeneratedShield=Math.floor(shield*regeneration/100+1e-9);
  const reviveAbility=enemyAttackAbility('revive');
  const reviveEnabled=!!reviveAbility&&enemyActiveHealthEffectKeys.has('revive');
  const reviveInfinite=reviveEnabled&&(!!reviveAbility?.infinite||Number(reviveAbility?.count)<0);
  const reviveCount=reviveEnabled&&!reviveInfinite?Math.max(0,Math.floor(Number(reviveAbility?.count)||0)):0;
  const revivePercent=Math.max(0,Number(reviveAbility?.hitpoints_percent)||0);
  // Enemy magnification is applied to the body first.  Revival HP is then
  // its stated percentage of that already-magnified body, with one final
  // floor so a fractional result never rounds up.
  const reviveHealth=reviveEnabled?Math.floor(stats.hp*revivePercent/100+1e-9):0;
  const segments=[];
  // Keep the body split into its real KB portions even when neither a
  // barrier nor a shield is selected.  The white markers in the health bar
  // are KB boundaries, not merely boundaries between optional effects.
  // Every colour transition is deliberately separated by the same thin
  // white line used for a unit's KB divisions.  A barrier precedes the
  // body only once; a shield precedes each body segment as it regenerates
  // on KB.
  if(barrier>0)segments.push({kind:'barrier',value:barrier,dividerAfter:true});
  const healthPerKb=stats.hp/stats.kb;
  // A revival is a partially depleted copy of the original HP bar.  Split
  // it at the original KB boundaries instead of dividing the revival value
  // into equal slices.  For 120,000 HP / 3 KB, a 50% revival is therefore
  // 20,000 + 40,000, not 30,000 + 30,000.
  const reviveKbSegments=[];
  if(reviveHealth>0&&healthPerKb>0){
    let remaining=reviveHealth;
    const leading=remaining%healthPerKb;
    if(leading>1e-9&&healthPerKb-leading>1e-9){
      reviveKbSegments.push(leading);
      remaining-=leading;
    }
    while(remaining>1e-9){
      const portion=Math.min(healthPerKb,remaining);
      reviveKbSegments.push(portion);
      remaining-=portion;
    }
  }
  for(let index=0;index<stats.kb;index++){
    const shieldAmount=index===0?shield:regeneratedShield;
    if(shieldAmount>0)segments.push({kind:'shield',value:shieldAmount,dividerAfter:true});
    if(healthPerKb>0)segments.push({kind:'health',value:healthPerKb,dividerAfter:index<stats.kb-1});
  }
  if(reviveHealth>0&&(reviveInfinite||reviveCount>0)){
    // Revivals occur after the original body (and any per-KB shields), so
    // force the same thin white separator between the two health groups.
    if(segments.length)segments[segments.length-1].dividerAfter=true;
    // Repeat that depleted-body pattern once per finite revival.  Every
    // boundary is explicit, including the join between two revivals.
    const revivalSegments=Array.from({length:reviveCount},()=>reviveKbSegments).flat();
    for(let index=0;index<revivalSegments.length;index++){
      segments.push({kind:'revive',value:revivalSegments[index],dividerAfter:index<revivalSegments.length-1});
    }
  }
  const shieldTotal=stats.hp+shield+regeneratedShield*Math.max(0,stats.kb-1);
  const finiteTotal=stats.hp+barrier+shield+regeneratedShield*Math.max(0,stats.kb-1)+reviveHealth*reviveCount;
  return {
    enabled,
    barrierEnabled,
    barrier,
    shield,
    regeneratedShield,
    regeneration,
    reviveEnabled,
    reviveInfinite,
    reviveCount,
    revivePercent,
    reviveHealth,
    reviveKbSegments,
    shieldTotal,
    segments:segments.length?segments:[{kind:'health',value:stats.hp,dividerAfter:false}],
    total:reviveInfinite&&reviveHealth>0?Infinity:finiteTotal,
  };
}

function enemySelectedAttackHits(baseHits){

    const hitNumber=Number(DATA.attacks?.[index]?.index)||index+1;
    let total=enemyForcedAttackDamage(baseAttack,hitNumber);
    for(const key of ['wave','mini_wave']){
      const ability=enemyAttackAbility(key);
      if(ability&&enemyActiveAttackEffectKeys.has(key)&&enemyAbilityAppliesToHit(ability,hitNumber))total+=enemyForcedAttackDamage(Math.floor(baseAttack*(key==='mini_wave'?.2:1)+1e-9),hitNumber);
    }
    for(const key of ['surge','mini_surge']){
      const ability=enemyAttackAbility(key);
      if(ability&&enemyActiveAttackEffectKeys.has(key)&&enemyAbilityAppliesToHit(ability,hitNumber)){
        const derived=Math.floor(baseAttack*(key==='mini_surge'?.2:1)+1e-9);
        total+=enemyForcedAttackDamage(derived,hitNumber)*Math.max(1,Math.trunc(Number(ability.level)||1));
      }

    const explosion=enemyAttackAbility('explosion');
    if(explosion&&enemyExplosionBandPercent>0&&enemyAbilityAppliesToHit(explosion,hitNumber)){

  });

function enemyAttackAbilityMultiplier(){
  // This badge deliberately uses raw attack values.  Enemy magnification,
  // treasure adjustments, rounding, and the selected damage band must not
  // change the ability multiplier displayed beside 공격력.
  const rawHits=((DATA.base||DATA.stats||{}).attackHits||(DATA.base||DATA.stats||{}).hits||DATA.attacks||[]).map(value=>typeof value==='number'?value:Number(value.damage??value.baseDamage??0));
  let rawTotal=0,abilityTotal=0;
  rawHits.forEach((rawValue,index)=>{
    const rawAttack=Math.max(0,Number(rawValue)||0);
    if(rawAttack<=0)return;
    const hitNumber=Number(DATA.attacks?.[index]?.index)||index+1;
    const applies=ability=>enemyAbilityAppliesToHit(ability,hitNumber);
    let forced=1;
    const strengthen=enemyAttackAbility('strengthen');
    if(strengthen&&enemyActiveAttackEffectKeys.has('strengthen')&&applies(strengthen))forced*=1+(Math.max(0,Number(strengthen.damage_boost_percent)||0)/100);
    const critical=enemyAttackAbility('critical');
    if(critical&&enemyActiveAttackEffectKeys.has('critical')&&applies(critical))forced*=2;
    const savage=enemyAttackAbility('savage_blow');
    if(savage&&enemyActiveAttackEffectKeys.has('savage_blow')&&applies(savage))forced*=Math.max(0,Number(savage.damage_multiplier)||1+(Math.max(0,Number(savage.damage_boost_percent)||0)/100));
    let factor=forced;
    for(const key of ['wave','mini_wave']){
      const ability=enemyAttackAbility(key);
      if(ability&&enemyActiveAttackEffectKeys.has(key)&&applies(ability))factor+=forced*(key==='mini_wave'?.2:1);
    }
    for(const key of ['surge','mini_surge']){
      const ability=enemyAttackAbility(key);
      if(ability&&enemyActiveAttackEffectKeys.has(key)&&applies(ability))factor+=forced*(key==='mini_surge'?.2:1)*Math.max(1,Math.trunc(Number(ability.level)||1));

function enemyRenderHealthMeter(card,health){
  const meter=card.querySelector('.stat-meter');
  if(!meter)return;
  meter.querySelector('.hp-fill')?.remove();
  meter.querySelector('.kb-markers')?.remove();
  // Keep the body layer as the exact same element used by the unit
  // calculator.  In particular, this is what gives a capped HP meter its
  // correctly rounded right end.  Shield / barrier overlays only replace
  // their own portions of that body layer.
  const max=Math.max(1,Number(state.hpMax)||1);
  // The coloured overlays must round at the end of the *actual* health
  // total, not only at the configured bar maximum.  Otherwise a zombie's
  // final revival segment covers the rounded green end with a square edge.
  const visibleTotal=Number.isFinite(health.total)?Math.min(max,health.total):max;
  const bodyFill=document.createElement('div');
  bodyFill.className='stat-meter-fill hp-fill';
  bodyFill.style.width=`${Math.min(100,health.total/max*100)}%`;
  const segments=document.createElement('div');
  segments.className='hp-health-segments';
  const dividers=document.createElement('div');
  dividers.className='kb-markers';
  let offset=0;
  health.segments.forEach(segment=>{
    const amount=Math.max(0,Number(segment.value)||0);
    if(amount<=0)return;
    // Do not merely let an oversized segment overflow the meter: its
    // rounded edge would then be outside the viewport and look square.
    // Clamp the rendered segment itself to the visible bar first, exactly
    // as the unit HP fill is capped at its configured maximum.
    const visibleStart=Math.min(max,offset);
    const visibleEnd=Math.min(max,offset+amount);
    // Health itself is already drawn by the unit-style body fill.  Draw
    // only the special coloured portions above it.
    if(segment.kind!=='health'&&visibleEnd>visibleStart){
      const fill=document.createElement('i');
      fill.className=`stat-meter-fill hp-health-segment ${segment.kind}`;
      const reachesRight=visibleEnd>=visibleTotal;
      fill.style.left=`${visibleStart/max*100}%`;
      fill.style.width=`${(visibleEnd-visibleStart)/max*100}%`;
      fill.style.borderRadius=`0 ${reachesRight?'6px':'0'} ${reachesRight?'6px':'0'} 0`;
      segments.append(fill);
    }
    offset+=amount;
    if(segment.dividerAfter&&offset>0&&offset<max){
      const divider=document.createElement('i');
      divider.className='kb-marker';
      divider.style.left=`${offset/max*100}%`;
      dividers.append(divider);
    }
  });
  // Infinite revival cannot have a literal infinite DOM list.  Draw the
  // visible remainder as one purple segment and lay out its white revival
  // boundaries individually (up to a safe visual cap).  The displayed HP
  // value remains ∞, while every visible cycle is still distinguished.
  if(health.reviveInfinite&&health.reviveHealth>0&&offset<max){
    const visibleStart=Math.min(max,offset);
    const fill=document.createElement('i');
    fill.className='stat-meter-fill hp-health-segment revive infinite-revive';
    fill.style.left=`${visibleStart/max*100}%`;
    fill.style.width=`${(max-visibleStart)/max*100}%`;
    fill.style.borderRadius='0 6px 6px 0';
    segments.append(fill);
    const pattern=health.reviveKbSegments||[];
    let boundary=offset;
    // Low magnification makes each revival/KB section very small (enemy 310
    // at 3% is the representative case).  240 markers visibly stopped the
    // white boundaries early, so retain a much higher safety cap only for
    // deliberately extreme user-configured bar maxima.
    const dividerLimit=4096;
    let count=0;
    while(pattern.length&&boundary<max&&count<dividerLimit){
      for(const portion of pattern){
        boundary+=portion;
        if(boundary>=max||count>=dividerLimit)break;
        const divider=document.createElement('i');
        divider.className='kb-marker';
        divider.style.left=`${boundary/max*100}%`;
        dividers.append(divider);
        count++;
      }
    }
  }
  meter.append(bodyFill,segments,dividers);
}

    if(x.distance!==undefined)p.push(`\uc774\ub3d9 ${enemyWarpText(x.distance)}`);
  }
  if(key==='revive'){
    if(x.count!==undefined)p.push(x.infinite?'\ubb34\uc81c\ud55c':`${number(x.count)}\ud68c`);
    if(x.delay_frames!==undefined)p.push(`${frameText(x.delay_frames)} \ub4a4 \ubd80\ud65c`);
    if(x.hitpoints_percent!==undefined)p.push(`\uccb4\ub825 ${number(x.hitpoints_percent)}%`);
  }
  return p.join(' \u00b7 ');
}
