    /* Keep the enemy calculator on the same visual system as the unit calculator. */
    :root {
      --surface-2: #171f29;
      --line: #293645;
      --muted: #94a2b6;
      --accent-2: #ffad3d;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    body {
      min-height: 143vh;
      overflow-x: hidden;
      zoom: .7;
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 74, 32, .22), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.035) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
    }
    .page { width: min(1220px, calc(100% - 36px)); padding: 24px 0 38px; }
    .db-toolbar {
      gap: 18px;
      margin-bottom: 12px;
      padding: 14px 18px;
      background: rgba(14, 19, 26, .92);
      box-shadow: var(--shadow);
    }
    .db-brand { flex: 0 0 auto; color: var(--text); }
    .db-brand span { color: var(--accent-text); }
    .unit-search { grid-template-columns: auto minmax(150px, 220px) auto; gap: 9px; }
    .unit-search label { color: #dce3ed; white-space: nowrap; }
    .unit-search input { padding:7px 11px; text-align:left; font-weight:400; font-variant-numeric:tabular-nums; }

    .treasure-settings {
      margin-bottom: 10px;
      border-color: var(--line);
      background: rgba(14, 19, 26, .92);
    }
    .treasure-settings summary {
      min-height: 52px;
      padding: 9px 18px;
      color: #dce3ed;
      font-size: 16px;
      font-weight: 900;
    }
    .summary-actions { display: inline-flex; }
    .soft-button, .toggle-label {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 12px;
      color: #dce3ed;
    }
    .soft-button:hover, .soft-button:focus-visible {
      border-color: rgba(255,255,255,.42);
      background: rgba(255,255,255,.12);
      outline: none;
    }
    .soft-button:disabled {
      color: #707d8e;
      cursor: default;
      opacity: .62;
    }
    .settings-panel { padding: 0 18px 16px; }
    .category-tabs { gap: 6px; padding: 12px 0 10px; scrollbar-width: thin; }
    .category-tab { padding: 7px 12px; font-size: 12px; }
    .category-tab[aria-pressed="true"] {
      border-color: rgba(255, 173, 61, .5);
      background: rgba(255, 173, 61, .14);
    }
    .treasure-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .treasure-card {
      container-name: treasure-card;
      container-type: inline-size;
      padding: 10px;
      background: var(--surface-2);
    }
    .treasure-head {
      grid-template-columns: 148px minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 9px;
    }
    .treasure-main { width: 148px; height: 58px; border-radius: 8px; object-fit: cover; }
    .treasure-note { margin:0 0 10px; color:var(--muted); font-size:11px; font-weight:700; }
    .treasure-card-title { min-width:0; }
    .treasure-name { margin:0; overflow:hidden; font-size:15px; font-weight:950; text-overflow:ellipsis; white-space:nowrap; }
    .treasure-desc { margin:4px 0 0; font-size:10px; font-weight:700; }
    .treasure-total { margin-top:0; color:var(--accent-text); font-size:15px; font-weight:950; }
    .chapters { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-top:0; }
    .chapter { padding: 7px; border-color: rgba(255,255,255,.08); background: rgba(8,12,18,.5); }
    .chapters .chapter:last-child { grid-column:auto; }
    .chapter-label { display:flex; align-items:center; justify-content:space-between; gap:5px; font-size:10px; }
    .treasure-chapter-percent { color:var(--accent-text); font-variant-numeric:tabular-nums; }
    .slots { grid-template-columns: repeat(4, 40px); gap: 5px; }
    .slot {
      width: 40px;
      height: 40px;
      aspect-ratio: auto;
      padding: 0;
      border-color: #3a4859;
      border-radius: 8px;
      background: #0b1017;
    }
    .slot img { width: 36px; height: 36px; }
    .slot:hover, .slot:focus-visible {
      border-color: #71839a;
      box-shadow: 0 0 0 2px rgba(255,173,61,.18);
      outline: none;
    }
    .slot::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 7px);
      z-index: 45;
      width: max-content;
      max-width: min(240px, calc(100vw - 44px));
      padding: 8px 10px;
      border: 1px solid #48586c;
      border-radius: 9px;
      color: #fff;
      background: #080c12;
      box-shadow: 0 8px 24px rgba(0,0,0,.38);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.5;
      text-align: left;
      white-space: pre-line;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 5px);
      transition: opacity .14s ease, transform .14s ease;
    }
    .slot:nth-child(4n + 1)::after { left:0; transform:translate(0,5px); }
    .slot:nth-child(4n)::after { right:0; left:auto; transform:translate(0,5px); }
    .slot:hover::after, .slot:focus-visible::after { opacity:1; transform:translate(-50%,0); }
    .slot:nth-child(4n + 1):hover::after, .slot:nth-child(4n + 1):focus-visible::after, .slot:nth-child(4n):hover::after, .slot:nth-child(4n):focus-visible::after { transform:translate(0,0); }
    .passive-cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .passive-card {
      min-width: 0;
      padding: 14px;
      border: 1px solid #2d3948;
      border-radius: 14px;
      background: var(--surface-2);
    }
    .passive-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .passive-card-header h3 { margin: 0; font-size: 16px; }
    .passive-current-level {
      color: var(--accent-text);
      font-size: 14px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .passive-effect {
      margin: -4px 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .passive-level-controls { display: grid; gap: 8px; }
    .passive-level-row {
      display: grid;
      grid-template-columns: 78px minmax(80px, 1fr) 58px;
      align-items: center;
      gap: 8px;
    }
    .passive-level-row label {
      color: #dce3ed;
      font-size: 11px;
      font-weight: 850;
    }
    .passive-level-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .passive-level-row input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 6px 7px;
      border: 1px solid #3a4859;
      border-radius: 8px;
      color: #fff;
      background: #0b1017;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .treasure-empty { font-size: 16px; font-weight: 900; }
    .treasure-empty-category {
      padding: 24px 14px;
      border: 1px dashed #344254;

    /* Shared controls from the current unit calculator. */

    .site-search-results[hidden] { display:none; }

    .site-search-result:last-child { border-bottom:0; }
    .site-search-result:hover,.site-search-result[aria-selected="true"] { background:#354252; }
    .site-search-result img,.site-search-result-icon-empty { display:block; width:54px; height:40px; object-fit:contain; image-rendering:pixelated; }
    .site-search-result-icon-empty { border:1px dashed #405066; border-radius:7px; }
    .site-search-result-copy { display:grid; min-width:0; gap:2px; }
    .site-search-result-name { min-width:0; overflow:hidden; font-size:13px; font-weight:900; text-overflow:ellipsis; white-space:nowrap; }
    .site-search-result-identity { color:var(--muted); font-size:10px; font-weight:850; letter-spacing:.03em; }
    .site-search-empty { padding:13px 10px; color:var(--muted); font-size:12px; font-weight:800; text-align:center; }

    /* Match the unit calculator's treasure and miscellaneous summaries exactly. */
    .treasure-settings,
    .misc-settings {
      margin-bottom:10px;
      overflow:hidden;
      border:1px solid var(--line);

      background:rgba(14,19,26,.92);

    }
    .treasure-settings summary,
    .misc-settings summary {
      display:flex;

      padding:9px 18px;

      font-weight:900;
      cursor:pointer;
      list-style:none;
    }
    .treasure-settings summary::-webkit-details-marker,

    .treasure-summary-actions,
    .misc-summary-actions { display:inline-flex; align-items:center; gap:7px; }
    .treasure-action-button {
      display:inline-flex;

    }
    .treasure-action-button:disabled { color:#707d8e; cursor:default; opacity:.62; }
    .settings-toggle-control { display:inline-flex; align-items:center; gap:7px; color:#dce3ed; font-size:14px; font-weight:900; white-space:nowrap; }
    .settings-toggle-arrow { color:var(--accent-text); font-size:22px; line-height:.8; transition:transform .16s ease; }
    .treasure-settings[open] .settings-toggle-arrow,
    .misc-settings[open] .settings-toggle-arrow { transform:rotate(180deg); }
    .treasure-panel,
    .misc-panel { padding:0 18px 16px; border-top:1px solid rgba(255,255,255,.08); }
    .misc-panel .bar-settings { justify-content:flex-end; margin-top:0; padding-top:14px; border-top:0; }
    .misc-panel .bar-settings-title { font-size:13px; }
    .distance-unit-settings {
      display:grid;
      gap:10px;
      margin-top:12px;
      padding-top:14px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .distance-unit-settings-title { color:var(--muted); font-size:13px; font-weight:900; }
    .distance-unit-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .distance-unit-reset {
      min-height:30px;
      padding:5px 12px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      color:#f4f7fb;

      font-weight:900;

    }
    .distance-unit-reset:hover:not(:disabled),

    .distance-unit-reset:disabled { color:#707d8e; cursor:default; opacity:.62; }
    .distance-unit-note { margin:0; color:#aeb9c8; font-size:11px; font-weight:750; line-height:1.6; }
    .distance-unit-note strong { color:var(--accent-text); }
    .distance-unit-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .distance-unit-field {
      display:grid;

      font-size:12px;
      font-weight:850;

    .description.is-empty { color:#78869a; }
    .attack-timeline-track { border-color:#fff; }
    /* Keep every ordinary enemy stat card on the same baseline as the unit
       calculator.  The native enemy renderer creates these cards dynamically,
       so their structural classes are assigned in normalizeEnemyStatCards(). */
    .stats-grid > .stat-card { align-self:start; }
    .stats-grid > .stat-card.enemy-range-card,
    .stats-grid > .stat-card.enemy-speed-card,
    .stats-grid > .stat-card.enemy-cash-card {
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
    }
    .stats-grid > .stat-card.enemy-range-card > .range-stack,
    .stats-grid > .stat-card.enemy-speed-card > .stat-value,
    .stats-grid > .stat-card.enemy-cash-card > .conditional-stat-row {
      align-self:center;
      width:100%;
      margin-top:0;
    }
    .stats-grid > .stat-card.enemy-cash-card .stat-value { margin-top:0; }
    .conditional-stat-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .stats > .stat-bar-card,
    .stats > .attack-cycle-card { align-self:start; }
    /* Match the generated unit calculator's details DOM and summary layout. */
    .attack-timing-details { margin-top:10px; border-top:1px solid #303c4b; }
    .attack-timing-details summary { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:8px; color:#d9e1eb; font-size:15px; font-weight:800; list-style:none; cursor:pointer; }
    .attack-timing-details summary .detail-summary-title { min-width:0; }
    .attack-timing-details summary .detail-summary-control { display:inline-flex; align-items:center; flex:0 0 auto; margin-left:auto; white-space:nowrap; }
    .attack-timing-details summary::-webkit-details-marker { display:none; }
    .attack-timing-details summary::after { content:"▾"; color:var(--accent-text); font-size:22px; line-height:.8; transition:transform .16s ease; }
    .attack-timing-details[open] summary::after { transform:rotate(180deg); }
    .attack-timing-details .when-open, .attack-timing-details[open] .when-closed { display:none; }
    .attack-timing-details[open] .when-open { display:inline; }
    .attack-effect-settings,
    .health-effect-settings,
    .hp-detail-settings,
    .expected-range-damage,
    .attack-detail-settings { margin-top:10px; padding-top:10px; border-top:1px solid #303c4b; }
    .attack-effect-settings h3,
    .health-effect-settings h3,
    .hp-detail-settings h3,
    .expected-range-header h3,
    .attack-detail-settings h3 { margin:0; color:#d9e1eb; font-size:14px; font-weight:950; }
    .hp-efficiency-list { display:grid; gap:8px; margin-top:8px; }
    .hp-efficiency-list .range-row { min-height:24px; }
    .hp-efficiency-value { min-width:0; text-align:right; overflow-wrap:anywhere; }
    .stat-bar-card { display:flex; flex-direction:column; }
    .stat-bar-summary { position:relative; flex:0 0 145px; min-height:145px; }
    .attack-bar-card .stat-bar-summary .bar-heading { padding-bottom:27px; }
    .stat-bar-card .stat-bar-summary .bar-detail {
      position:absolute;
      right:0;
      bottom:8px;
      left:0;
      width:100%;
      max-width:100%;
      margin:0;
      justify-content:flex-end;
      text-align:right;
      white-space:nowrap;
    }
    .stat-bar-card > .hp-damage-details,
    .stat-bar-card > .attack-damage-details { width:100%; margin-top:0; }
    .attack-breakdown[hidden] { display:block; visibility:hidden; }
    .attack-effect-toggle-list { display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
    .attack-effect-toggle { display:grid; grid-template-columns:34px minmax(0,1fr) 18px; align-items:center; gap:7px; min-width:min(100%,178px); padding:6px 8px; border:1px solid #39485a; border-radius:10px; color:#f2f5f9; background:#121a24; font-size:12px; font-weight:900; cursor:default; }
    .attack-effect-toggle:has(input:checked),
    .attack-effect-toggle.selected { border-color:var(--gold); background:rgba(255,147,55,.12); box-shadow:inset 0 0 0 1px rgba(255,183,91,.18); }
    .attack-effect-toggle.explosion-band-control { grid-template-columns:34px minmax(0,1fr) 76px; }
    .attack-effect-toggle img,
    .attack-effect-toggle .fallback-icon { width:34px; height:34px; border-radius:8px; object-fit:contain; font-size:13px; }
    .attack-effect-toggle-copy { display:grid; gap:1px; min-width:0; }
    .attack-effect-toggle-copy small { color:var(--gold); font-size:10px; font-weight:850; }
    .attack-effect-toggle input { width:17px; height:17px; margin:0; accent-color:var(--accent); }
    .attack-effect-band-select { min-width:0; width:76px; height:28px; padding:2px 5px; border:1px solid #526276; border-radius:7px; color:#f4f7fb; background:#0b1119; font:900 11px/1 system-ui,sans-serif; }
    .expected-range-header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .expected-metric-toggle { flex:0 0 auto; padding:2px; }
    .expected-metric-toggle button { min-height:28px; padding:4px 9px; font-size:11px; }
    .expected-range-chart-shell { position:relative; min-height:190px; margin-top:8px; overflow:hidden; border:1px solid #445266; border-radius:11px; background:linear-gradient(180deg,#111924,#0c121a); }
    .expected-range-chart-shell canvas { display:block; width:100%; height:190px; }
    .expected-range-tooltip { position:absolute; z-index:4; display:flex; align-items:baseline; gap:10px; width:max-content; max-width:calc(100% - 12px); padding:7px 10px; border:1px solid #48586c; border-radius:9px; color:#fff; background:#080c12; box-shadow:0 8px 24px rgba(0,0,0,.42); font-size:12px; font-weight:800; line-height:1.35; white-space:nowrap; pointer-events:none; transform:translate(-50%,calc(-100% - 8px)); }
    .expected-range-tooltip[hidden],
    .expected-range-empty[hidden] { display:none; }

    .expected-range-result-label { color:#d9e1eb; font-size:12px; font-weight:900; white-space:nowrap; }

    .expected-range-query input { min-width:0; height:34px; padding:5px 8px; border:1px solid #445266; border-radius:8px; color:#f4f7fb; background:#0d141d; font:inherit; font-size:12px; font-weight:850; font-variant-numeric:tabular-nums; }
    .expected-range-query output { min-width:0; padding:2px 0 2px 8px; color:var(--gold); background:transparent; font-size:30px; font-weight:950; line-height:1.05; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    @media(max-width:650px){

    }
    @media(max-width:620px){ .distance-unit-grid { grid-template-columns:1fr; } }

<body>
<main class="page">
  <header class="toolbar db-toolbar">
    <a class="brand db-brand" href="../index.html">냥코<span>DB</span></a>
    <form class="search unit-search" id="enemy-search" role="search"><label for="enemy-search-input">검색</label><div class="site-search-field"><input id="enemy-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="이름 입력" aria-label="검색할 이름" aria-autocomplete="list" aria-controls="enemy-search-results" aria-expanded="false"><div class="site-search-results" id="enemy-search-results" role="listbox" aria-label="검색 결과" hidden></div></div><button type="submit">검색</button></form>

  <details class="treasure-settings" id="treasure-settings">

  </details>

  <details class="settings misc-settings" id="misc-settings">
    <summary><span>&#44592;&#53440; &#49444;&#51221;</span><span class="misc-summary-actions"><span class="settings-toggle-control"><span class="misc-toggle-label" id="misc-toggle"></span><span class="settings-toggle-arrow" aria-hidden="true">&#9662;</span></span></span></summary>
    <div class="settings-panel misc-panel" id="enemy-misc-panel">
      <section class="distance-unit-settings" aria-labelledby="distance-unit-settings-title">
        <div class="distance-unit-heading"><span class="distance-unit-settings-title" id="distance-unit-settings-title">&#44144;&#47532; &#45800;&#50948; &#49444;&#51221;</span><button type="button" class="distance-unit-reset" id="distance-unit-reset" disabled>&#52488;&#44592;&#54868;</button></div>
        <p class="distance-unit-note"><strong>u</strong>: &#44592;&#48376; &#45800;&#50948; &#44144;&#47532; &middot; <strong>spu</strong>: &#51060;&#46041;&#49549;&#46020; &#45800;&#50948; &#44144;&#47532; &middot; <strong>rng</strong>: &#49324;&#44144;&#47532; &#45800;&#50948; &#44144;&#47532;</p>
        <div class="distance-unit-grid">
          <label class="distance-unit-field"><span>&#49324;&#44144;&#47532; &#45800;&#50948;</span><select id="range-unit-select" aria-label="&#49324;&#44144;&#47532; &#45800;&#50948;"><option value="rng">rng</option><option value="u">u</option><option value="spu">spu</option></select></label>
          <label class="distance-unit-field"><span>&#51060;&#46041;&#49549;&#46020; &#45800;&#50948;</span><select id="speed-unit-select" aria-label="&#51060;&#46041;&#49549;&#46020; &#45800;&#50948;"><option value="spu/f">spu/f</option><option value="spu/s">spu/s</option><option value="u/f">u/f</option><option value="u/s">u/s</option><option value="rng/f">rng/f</option><option value="rng/s">rng/s</option></select></label>
        </div>

      <p class="description" id="enemy-description"></p>
      <div class="level-summary">
        <div class="current-level">현재 배율 <strong><span id="magnification-badge"></span>%</strong><span class="treasure-application" id="treasure-application" hidden></span></div>

$('range-unit-select').addEventListener('change',event=>{state.rangeUnit=event.target.value;persistEnemySharedSettings();syncDistanceReset();renderStats()});
$('speed-unit-select').addEventListener('change',event=>{state.speedUnit=event.target.value;persistEnemySharedSettings();syncDistanceReset();renderStats()});
$('distance-unit-reset').addEventListener('click',()=>{state.rangeUnit='rng';state.speedUnit='spu/f';$('range-unit-select').value=state.rangeUnit;$('speed-unit-select').value=state.speedUnit;persistEnemySharedSettings();syncDistanceReset();renderStats()});
syncDistanceReset();
window.addEventListener('resize',()=>{if(!document.querySelector('#hpDamageDetails[open],#attackDamageDetails[open],.attack-timing-details[open]'))requestAnimationFrame(lockEnemyPeerHeights);if(document.querySelector('#attackDamageDetails[open]'))requestAnimationFrame(enemyDrawExpectedRangeChart)});
document.addEventListener('input',()=>queueMicrotask(persistEnemySharedSettings));
document.addEventListener('change',()=>queueMicrotask(persistEnemySharedSettings));
document.addEventListener('click',()=>queueMicrotask(persistEnemySharedSettings));
document.addEventListener('toggle',event=>{if(event.target.matches?.('#hpDamageDetails,#attackDamageDetails,.attack-timing-details,.treasure-settings,.misc-settings'))queueMicrotask(persistEnemyDetailPanels)},true);
renderStats();renderTraits();renderEffects();renderTreasure();

function effectSummary(x){
  const key=x.key||'',p=[],number=value=>fmt(value),rangeText=range=>{
    const minimum=Number(range?.minimum??range?.min??0),maximum=Number(range?.maximum??range?.max??minimum);
    const left=enemyRangeText(Math.min(minimum,maximum)),right=enemyRangeText(Math.max(minimum,maximum));
    return Math.abs(minimum-maximum)<1e-9?left:`${left}~${right}`;
  };
  if(key==='attack_count')return `${number(x.count||0)}\ud68c \uacf5\uaca9`;
  if(key==='multi_hit'){
    const hits=Array.isArray(x.applies_to_attacks)?x.applies_to_attacks.map(Number).filter(Number.isFinite):[];
    return `${number(x.hit_count||0)}\uc5f0\uc18d \uacf5\uaca9${hits.length?` \u00b7 \ud2b9\uc218\ud6a8\uacfc \ubc1c\ub3d9 ${hits.join('\u00b7')}\ud0c0`:''}`;
  }
  if(x.chance!==undefined)p.push(`\ud655\ub960 ${number(x.chance)}%`);
  if(x.duration_frames!==undefined)p.push(frameText(x.duration_frames));
  if(['wave','mini_wave','surge','mini_surge','death_surge'].includes(key)&&x.level!==undefined)p.push(`Lv.${number(x.level)}`);
  if(key==='weaken'&&x.attack_percent!==undefined)p.push(`\uacf5\uaca9\ub825\uc744 ${number(x.attack_percent)}%\ub85c \uac10\uc18c`);
  if(key==='warp'&&x.minimum!==undefined&&x.maximum!==undefined)p.push(`\uc774\ub3d9 \uac70\ub9ac ${number(x.minimum)}~${number(x.maximum)}`);
  if(key==='critical'){
    p.push(`\uc8fc\ub294 \ud53c\ud574 ${number(x.damage_multiplier??2)}\u00d7`,`\uba54\ud0c8 \ub2a5\ub825 \ubb34\uc2dc`);
  }
  if(key==='savage_blow'&&x.damage_multiplier!==undefined)p.push(`\uc8fc\ub294 \ud53c\ud574 ${number(x.damage_multiplier)}\u00d7`);
  if(key==='strengthen'){
    if(x.hitpoints_threshold_percent!==undefined)p.push(`\uccb4\ub825 ${number(x.hitpoints_threshold_percent)}% \uc774\ud558`);
    if(x.damage_boost_percent!==undefined){
      const multiplier=1+Number(x.damage_boost_percent)/100;
      p.push(`\uacf5\uaca9\ub825 +${number(x.damage_boost_percent)}% (${number(multiplier)}\u00d7)`);
    }
  }
  if(key==='base_destroyer')p.push('\ub0e5\ucf54 \uc131\uc5d0 \uc8fc\ub294 \ud53c\ud574 4\u00d7');
  if(['mini_wave','mini_surge'].includes(key))p.push(`\uc8fc\ub294 \ud53c\ud574 20%`);
  if(['surge','mini_surge','death_surge','explosion'].includes(key)&&x.range)p.push(`\uc0dd\uc131 ${rangeText(x.range)}`);
  if(key==='explosion')p.push(`\ud53c\ud574\ub300 ${(x.damage_bands_percent||[100,70,40]).join('/')}%`);
  if(key==='toxic'&&x.max_hitpoints_damage_percent!==undefined)p.push(`\ucd5c\ub300 \uccb4\ub825\uc758 ${number(x.max_hitpoints_damage_percent)}%`);
  if(key==='drain'&&x.cooldown_extension_percent!==undefined)p.push(`\uc0dd\uc0b0 \uc2dc\uac04 +${number(x.cooldown_extension_percent)}%`);
  if(['barrier','shield'].includes(key)&&x.hitpoints!==undefined)p.push(`\uccb4\ub825 ${number(key==='shield'?enemyScale(x.hitpoints):x.hitpoints)}`);
  if(key==='shield'&&x.regeneration_percent!==undefined&&Number(x.regeneration_percent)!==100)p.push(`\uc7ac\uc0dd ${number(x.regeneration_percent)}%`);
  if(key==='burrow'){
    if(x.count!==undefined)p.push(x.infinite?'\ubb34\uc81c\ud55c':`${number(x.count)}\ud68c`);
    if(x.distance!==undefined)p.push(`\uc774\ub3d9 ${number(x.distance)}`);
  }
  if(key==='revive'){
    if(x.count!==undefined)p.push(x.infinite?'\ubb34\uc81c\ud55c':`${number(x.count)}\ud68c`);
    if(x.delay_frames!==undefined)p.push(`${frameText(x.delay_frames)} \ub4a4 \ubd80\ud65c`);
    if(x.hitpoints_percent!==undefined)p.push(`\uccb4\ub825 ${number(x.hitpoints_percent)}%`);
  }
  return p.join(' \u00b7 ');
}
