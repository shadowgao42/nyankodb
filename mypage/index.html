<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>마이페이지 · 냥코DB</title><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="treasure-shared.css"><link rel="stylesheet" href="../gnb.css"><link rel="stylesheet" href="../stage-list.css"><link rel="stylesheet" href="inventory-shared.css"><link rel="stylesheet" href="unit-picker-filters.css"><link rel="stylesheet" href="stage-picker-filters.css"></head>
<body data-view="account"><main class="page">
<header data-nyanko-gnb data-search-prefix="unitSearch"></header><script src="../gnb.js"></script>
<section class="panel account-loading" id="accountLoading" aria-label="계정 정보 로딩"><p class="empty-results" role="status" aria-live="polite">로딩중...</p><canvas id="loadingAnimation" class="loading-animation" width="480" height="320" role="img" aria-label="꼬마선녀 루나 애니메이션" data-animation-state="loading"></canvas></section>
<p id="status" class="status" role="status" aria-live="polite"></p>
<div id="accountView" hidden>
<section class="panel"><div class="section-heading account-heading"><h2 id="userName"></h2><div class="account-edit-actions"><button id="syncAccount" class="action" type="button" aria-pressed="false" disabled>연동</button><button id="editAccount" class="action" type="button" disabled>수정</button><button id="saveAccount" class="action primary" type="button" disabled>저장</button></div></div>
<div class="panel-body"><p id="editStatus" class="status" role="status" aria-live="polite"></p><form id="linkForm" class="link-form" autocomplete="off"><div><label for="transferCode">이어하기 코드</label><input id="transferCode" name="code" autocomplete="off" spellcheck="false" required maxlength="32"></div><div><label for="transferPin">인증번호</label><input id="transferPin" name="pin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" required minlength="4" maxlength="4"></div><button class="action primary" type="submit">계정 불러오기</button></form><p id="linkStatus" class="status" role="status" aria-live="polite"></p></div></section>
<form id="profileForm">
<details class="treasure-settings account-details" id="ownedPanel" open><summary><span>보유 캐릭터</span><span class="treasure-summary-actions"><span id="ownedCount" class="owned-count"></span><span class="settings-toggle-control"><span class="treasure-toggle-label">접기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span></summary><div class="treasure-panel account-panel-content"><div id="ownedUnits"><p class="empty">연동된 캐릭터가 없습니다.</p></div></div></details>
<details class="treasure-settings account-details" id="passivePanel" open><summary><span class="treasure-summary-actions"><button type="button" class="treasure-action-button" id="allMaxPassives" hidden disabled>올 만렙</button><span>패시브</span></span><span class="treasure-summary-actions"><span class="settings-toggle-control"><span class="treasure-toggle-label">접기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span></summary><div class="treasure-panel account-panel-content"><div id="passiveContent"><p class="empty">연동된 패시브가 없습니다.</p></div></div></details>
<details class="treasure-settings account-details" id="treasurePanel" open><summary><span class="treasure-summary-actions"><button type="button" class="treasure-action-button" id="allGoldTreasures" hidden disabled>올금</button><span>보물 상태</span></span><span class="treasure-summary-actions"><span class="settings-toggle-control"><span class="treasure-toggle-label">접기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span></summary><div class="treasure-panel account-panel-content"><div class="treasure-category-tabs" id="treasureTabs" role="group" aria-label="보물 종류" hidden></div><div id="treasureContent"><p class="empty">연동된 보물이 없습니다.</p></div></div></details>
<details class="treasure-settings account-details" id="inventoryPanel" open><summary><span>보유 아이템</span><span class="treasure-summary-actions"><span class="settings-toggle-control"><span class="treasure-toggle-label">접기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span></summary><div id="inventoryContent"><p class="empty">연동된 아이템이 없습니다.</p></div></details>
</form><details class="treasure-settings account-details" id="clearedStagesPanel"><summary><span id="clearedStagesTitle">클리어 스테이지</span><span class="treasure-summary-actions"><span id="clearedStagesCount" class="owned-count" role="status" aria-live="polite"></span><span class="settings-toggle-control"><span class="treasure-toggle-label">펼치기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span></summary><div class="account-add-actions"><button id="addClearedStage" class="action" type="button" hidden>+ 클리어 스테이지 추가</button></div><div class="stage-list" id="clearedStagesList"></div></details></div></main>
<dialog id="saveConfirmation" class="confirm-dialog" aria-labelledby="saveQuestion" tabindex="-1"><p id="saveQuestion">저장하시겠습니까?</p><p id="saveError" class="status" role="status" aria-live="polite"></p><div class="confirm-actions"><button type="button" class="action primary" id="saveYes">예</button><button type="button" class="action" id="saveNo" autofocus>아니오</button></div></dialog>
<dialog id="profileEditor" class="confirm-dialog account-editor-dialog" aria-labelledby="editorTitle" tabindex="-1"><div class="editor-header"><p id="editorTitle"></p><div id="editorUnitSort" class="tabs" role="group" aria-label="캐릭터 정렬" hidden></div></div><form id="editorForm"><div id="editorContent"></div><p id="editorStatus" class="status" role="status" aria-live="polite"></p><div class="confirm-actions"><button id="editorCancel" class="action" type="button">취소</button><button id="editorApply" class="action primary" type="submit">적용</button></div></form></dialog>
<div id="accountTooltip" class="tooltip" role="tooltip" hidden></div>
<script src="../unit/catalog.js"></script><script src="../animation-viewer-core.js" defer></script><script src="loading-animation.js" defer></script><script src="../catalog.js"></script><script src="../search.js" defer></script><script src="../stage-list.js" defer></script><script src="unit-picker-filters.js" defer></script><script src="../stage-filter-data.js" defer></script><script src="../stage-filters.js" defer></script><script src="../unit/unit-encyclopedia.js"></script><script src="../unit-guide.js"></script><script src="account.js" defer></script></body></html>
