<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>세일 일정 · 냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --line: #293645;
      --text: #f4f7fb;
      --muted: #94a2b6;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 143vh;
      margin: 0;
      overflow-x: hidden;
      zoom: .7;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 74, 32, .18), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.03) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .page {
      display: flex;
      flex-direction: column;
      width: min(1220px, calc(100% - 36px));
      min-height: 143vh;
      margin: 0 auto;
      padding: 24px 0 38px;
    }
    .search-panel {
      margin-top: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(14, 19, 26, .94);
      box-shadow: var(--shadow);
    }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(22px, 3vw, 29px); letter-spacing: -.045em; }
    .search-description { margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 800; }
    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 1220px); padding-top: 12px; }
      .search-panel { padding: 15px; }
    }
  </style>
  <link rel="stylesheet" href="../gnb.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="event-frame.css">
  <link rel="stylesheet" href="../unit-guide.css">
  <link rel="stylesheet" href="sale.css">
  <script src="event-frame.js"></script>
</head>
<body>
  <main class="page sale-schedule">
    <header data-nyanko-gnb data-search-prefix="unitSearch" data-search-placeholder="이름 입력"></header>
    <script src="../gnb.js"></script>
    <section class="search-panel" aria-labelledby="eventTitle">
      <div class="section-heading"><div>
        <h1 id="eventTitle">세일 일정</h1>
        <p class="search-description">세일 일정을 조회할 수 있습니다. <time id="eventUpdatedAt" hidden></time></p>
      </div></div>
    </section>
    <details class="event-settings" id="eventSettings">
      <summary><span>설정</span><span class="event-settings-actions">
        <button class="event-settings-reset" id="eventSettingsReset" type="button" disabled>초기화</button>
        <span class="event-settings-toggle"><span id="eventSettingsToggleLabel">펼치기</span><span class="event-settings-arrow" aria-hidden="true">▾</span></span>
      </span></summary>
      <div class="event-settings-panel">
        <section class="event-settings-section event-language-options" aria-labelledby="eventLanguageTitle">
          <h2 id="eventLanguageTitle">언어</h2>
          <select id="eventRegion" aria-labelledby="eventLanguageTitle" aria-controls="calendarDays saleEvents"><option value="kr">한국판</option><option value="jp">일본판</option></select>
        </section>
        <section class="event-settings-section event-category-options" aria-labelledby="saleDisplayTitle">
          <h2 id="saleDisplayTitle">세일 표시</h2>
          <div class="sale-type-filters">
            <label class="calendar-filter-toggle"><span>팩</span><input type="checkbox" data-sale-kind="pack" checked aria-controls="calendarDays saleEvents"><span class="calendar-filter-check" aria-hidden="true">✓</span></label>
            <label class="calendar-filter-toggle"><span>로그인 스탬프</span><input type="checkbox" data-sale-kind="stamp" checked aria-controls="calendarDays saleEvents"><span class="calendar-filter-check" aria-hidden="true">✓</span></label>
            <label class="calendar-filter-toggle"><span>기타 보상</span><input type="checkbox" data-sale-kind="reward" checked aria-controls="calendarDays saleEvents"><span class="calendar-filter-check" aria-hidden="true">✓</span></label>
          </div>
        </section>
      </div>
    </details>
    <section class="event-calendar" aria-labelledby="calendarMonth">
      <div class="calendar-toolbar"><h2 id="calendarMonth" aria-live="polite"></h2><div class="calendar-navigation" aria-label="캘린더 이동">
        <button type="button" id="previousMonth" aria-label="이전 달">‹</button><button type="button" id="calendarToday">오늘</button><button type="button" id="nextMonth" aria-label="다음 달">›</button>
      </div></div>
      <p class="calendar-status" id="calendarStatus" role="status">세일 일정을 불러오는 중입니다.</p>
      <div class="calendar-legend" id="calendarLegend" role="group" aria-label="세일 종류 색상" hidden></div>
      <div class="calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="calendar-days" id="calendarDays" role="group" aria-labelledby="calendarMonth"></div>
      <noscript><p class="calendar-noscript">캘린더를 사용하려면 JavaScript를 켜 주세요.</p></noscript>
    </section>
    <section class="event-day-panel" aria-labelledby="saleSelectedDate">
      <div class="calendar-selection"><span>선택한 날짜</span><p id="saleSelectedDate" aria-live="polite"></p><span class="sale-count" id="saleCount" aria-live="polite"></span></div>
      <p class="calendar-status" id="saleStatus" role="status">세일 일정을 불러오는 중입니다.</p>
      <div class="calendar-day-events sale-events" id="saleEvents" aria-labelledby="saleSelectedDate"></div>
    </section>
  </main>
  <script src="../catalog.js"></script>
  <script src="../search.js" defer></script>
  <script src="../unit/catalog.js"></script>
  <script src="sale.js" defer></script>
</body>
</html>
