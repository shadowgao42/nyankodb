<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>이벤트 일정 (공사중) · 냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --line: #293645;
      --text: #f4f7fb;
      --muted: #94a2b6;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 143vh;
      margin: 0;
      overflow-x: hidden;
      zoom: .7;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 74, 32, .18), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.03) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .page {
      display: flex;
      flex-direction: column;
      width: min(1220px, calc(100% - 36px));
      min-height: 143vh;
      margin: 0 auto;
      padding: 24px 0 38px;
    }
    .search-panel {
      margin-top: 12px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(14, 19, 26, .94);
      box-shadow: var(--shadow);
    }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(22px, 3vw, 29px); letter-spacing: -.045em; }
    .search-description { margin-top: 6px; color: var(--muted); font-size: 13px; font-weight: 800; }
    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 1220px); padding-top: 12px; }
      .search-panel { padding: 15px; }
    }
  </style>
  <link rel="stylesheet" href="../gnb.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="event-tabs.css">
</head>
<body>
  <main class="page">
    <header data-nyanko-gnb data-search-prefix="unitSearch" data-search-placeholder="이름 입력"></header>
    <script src="../gnb.js"></script>
    <section class="search-panel" aria-labelledby="eventTitle">
      <div class="section-heading">
        <div>
          <h1 id="eventTitle">이벤트 일정 <span class="event-construction">(공사중)</span></h1>
          <p class="search-description">이벤트 일정을 조회할 수 있습니다. <time id="eventUpdatedAt" hidden></time></p>
        </div>
        <div class="nyanko-gnb event-view-nav">
          <nav class="gnb-menu" role="tablist" aria-label="일정 종류">
            <button class="gnb-menu-link" type="button" role="tab" id="gachaViewTab" data-event-view="gacha" aria-controls="gachaViewPanel" aria-selected="false" tabindex="-1"><img src="../img/ui/gnb/gacha.png" alt="" width="48" height="48"><span>뽑기</span></button>
            <button class="gnb-menu-link" type="button" role="tab" id="stageViewTab" data-event-view="stage" aria-controls="stageViewPanel" aria-selected="true"><img src="../img/ui/gnb/stage.png" alt="" width="48" height="48"><span>스테이지</span></button>
          </nav>
        </div>
      </div>
    </section>
    <section class="event-view-panel" id="gachaViewPanel" role="tabpanel" aria-labelledby="gachaViewTab" hidden>
      <iframe class="event-view-frame" data-view="gacha" src="stage-test.html?embedded=1" title="뽑기 일정"></iframe>
    </section>
    <section class="event-view-panel" id="stageViewPanel" role="tabpanel" aria-labelledby="stageViewTab">
      <iframe class="event-view-frame" data-view="stage" src="stage.html?embedded=1" title="스테이지 일정"></iframe>
    </section>
  </main>
  <script src="../catalog.js"></script>
  <script src="../search.js" defer></script>
  <script src="event-tabs.js" defer></script>
  <script src="../analytics-bundle.js"></script>
</body>
</html>
