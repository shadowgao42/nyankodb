<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>환영의 행사풍선 · 냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --surface: #111720;
      --surface-2: #171f29;
      --line: #293645;
      --text: #f4f7fb;
      --muted: #94a2b6;
      --accent: #ff5b2d;
      --accent-2: #ffad3d;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 143vh;
      overflow-x: hidden;
      zoom: .7;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(255,74,32,.22), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.035) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    select { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(1220px, calc(100% - 36px)); margin: 0 auto; padding: 24px 0 38px; }
    .db-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      margin-bottom: 12px; padding: 14px 18px; border: 1px solid var(--line);
      border-radius: 17px; background: rgba(14,19,26,.92); box-shadow: var(--shadow);
    }
    .db-brand {
      flex: 0 0 auto; color: var(--text); text-decoration: none; cursor: pointer; font-size: 25px;
      font-weight: 950; letter-spacing: -.05em;
    }
    .db-brand span { color: var(--accent-text); }
    .unit-search { display: grid; grid-template-columns: auto minmax(150px, 220px) auto; align-items: center; gap: 9px; }
    .unit-search-field { position: relative; min-width: 0; }
    .unit-search-field > input { width: 100%; border-color: #4d5a69; background: #171d25; }
    .unit-search .unit-search-field > input:focus { border-color: #788697; box-shadow: 0 0 0 2px rgba(145,158,173,.18); }
    .unit-search button[type="submit"] { border: 1px solid #596777; color: #f4f7fb; background: #303a47; }
    .unit-search button[type="submit"]:hover { border-color: #718094; background: #3a4655; }
    .unit-search-results {
      position: absolute; top: calc(100% + 7px); left: 0; z-index: 120;
      width: min(380px, calc(100vw - 44px)); max-height: 360px; padding: 6px;
      overflow-y: auto; border: 1px solid #46566a; border-radius: 12px;
      background: #080d14; box-shadow: 0 16px 42px rgba(0,0,0,.52);
      scrollbar-width: thin; touch-action: pan-y;
    }
    .unit-search-results[hidden] { display: none; }
    .unit-search .unit-search-result {
      display: grid; grid-template-columns: 54px minmax(0,1fr); align-items: center; gap: 10px;
      width: 100%; min-height: 48px; padding: 5px 9px; border: 0;
      border-bottom: 1px solid #465363; border-radius: 0; color: #f4f7fb;
      background: #27313e; text-align: left; cursor: pointer; touch-action: pan-y;
    }
    .unit-search .unit-search-result:last-child { border-bottom: 0; }
    .unit-search .unit-search-result:hover, .unit-search .unit-search-result[aria-selected="true"] { background: #354252; }
    .unit-search-result img, .unit-search-result-icon-empty {
      display: block; width: 54px; height: 40px; object-fit: contain; image-rendering: pixelated;
    }
    .unit-search-result-icon-empty { border: 1px dashed #405066; border-radius: 7px; }
    .unit-search-result-copy { display: grid; min-width: 0; gap: 2px; }
    .unit-search-result-name { min-width: 0; overflow: hidden; font-size: 13px; font-weight: 900; text-overflow: ellipsis; white-space: nowrap; }
    .unit-search-result-identity { color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .03em; }
    .unit-search-empty { padding: 13px 10px; color: var(--muted); font-size: 12px; font-weight: 800; text-align: center; }
    .unit-search label { color: #dce3ed; font-size: 13px; font-weight: 900; white-space: nowrap; }
    .unit-search input { min-width: 0; height: 38px; padding: 7px 11px; border: 1px solid #425267; border-radius: 9px; color: var(--text); background: #0c1118; outline: none; font-variant-numeric: tabular-nums; }
    .unit-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,91,45,.2); }
    .unit-search button { height: 38px; padding: 7px 15px; border: 0; border-radius: 9px; color: #fff; background: var(--accent); font-size: 13px; font-weight: 900; cursor: pointer; }

    .treasure-settings, .misc-settings {
      margin-bottom: 10px; overflow: hidden; border: 1px solid var(--line);
      border-radius: 17px; background: rgba(14,19,26,.92); box-shadow: var(--shadow);
    }
    .treasure-settings { overflow: visible; }
    .treasure-settings summary, .misc-settings summary {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 52px; padding: 9px 18px; color: #dce3ed; font-size: 16px;
      font-weight: 900; list-style: none; cursor: pointer;
    }
    .treasure-settings summary::-webkit-details-marker, .misc-settings summary::-webkit-details-marker { display: none; }
    .treasure-summary-actions, .misc-summary-actions, .settings-toggle-control { display: inline-flex; align-items: center; gap: 7px; }
    .treasure-action-button { display: inline-flex; align-items: center; min-height: 30px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; color: #dce3ed; background: rgba(255,255,255,.06); font-size: 12px; font-weight: 900; cursor: pointer; }
    .distance-unit-reset { min-height: 30px; padding: 5px 12px; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; color: #f4f7fb; background: rgba(255,255,255,.07); font-size: 12px; font-weight: 900; cursor: pointer; }
    .treasure-action-button:hover:not(:disabled), .treasure-action-button:focus-visible,
    .distance-unit-reset:hover:not(:disabled), .distance-unit-reset:focus-visible {
      border-color: rgba(255,255,255,.42); background: rgba(255,255,255,.12); outline: none;
    }
    .treasure-action-button:disabled, .distance-unit-reset:disabled { color: #707d8e; cursor: default; opacity: .62; }
    .settings-toggle-control { color: #dce3ed; font-size: 14px; font-weight: 900; white-space: nowrap; }
    .settings-toggle-arrow { color: var(--accent-text); font-size: 22px; line-height: .8; transition: transform .16s ease; }
    .treasure-settings[open] .settings-toggle-arrow, .misc-settings[open] .settings-toggle-arrow { transform: rotate(180deg); }
    .treasure-panel, .misc-panel { padding: 0 18px 16px; border-top: 1px solid rgba(255,255,255,.08); }
    .treasure-category-tabs { display: flex; gap: 6px; padding: 12px 0 10px; overflow-x: auto; scrollbar-width: thin; }
    .treasure-category-tab {
      flex: 0 0 auto; padding: 7px 12px; border: 1px solid #364456; border-radius: 9px;
      color: var(--muted); background: #0d1219; font-size: 12px; font-weight: 900;
    }
    .treasure-category-tab[aria-pressed="true"] { color: #fff; border-color: rgba(255,173,61,.5); background: rgba(255,173,61,.14); }
    .treasure-note { margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .treasure-cards { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .treasure-card {
      container-name: treasure-card; container-type: inline-size; min-width: 0; padding: 10px;
      border: 1px solid #2d3948; border-radius: 14px; background: var(--surface-2);
    }
    .treasure-card:hover, .treasure-card:focus-within { position: relative; z-index: 2; }
    .treasure-card-header { display: grid; grid-template-columns: 148px minmax(0,1fr) auto; align-items: center; gap: 10px; margin-bottom: 9px; }
    .treasure-effect-image { width: 148px; height: 58px; border-radius: 8px; object-fit: cover; image-rendering: pixelated; }
    .treasure-card-title { min-width: 0; }
    .treasure-card-title h3 { margin: 0; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .treasure-card-title p { margin: 4px 0 0; color: var(--muted); font-size: 10px; font-weight: 700; }
    .treasure-total { color: var(--accent-text); font-size: 15px; font-weight: 950; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .treasure-chapters { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
    .treasure-chapter { min-width: 0; padding: 7px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: rgba(8,12,18,.5); }
    .treasure-chapter-heading { display: flex; align-items: center; justify-content: space-between; gap: 5px; margin-bottom: 6px; color: #dce3ed; font-size: 10px; font-weight: 900; }
    .treasure-chapter-percent { color: var(--accent-text); font-variant-numeric: tabular-nums; }
    .treasure-slots { display: grid; grid-template-columns: repeat(4,40px); gap: 5px; }
    .treasure-slot {
      display: grid; place-items: center; position: relative; width: 40px; height: 40px;
      padding: 0; border: 1px solid #3a4859; border-radius: 8px;
      color: #667487; background: #0b1017; outline: none; cursor: pointer;
    }
    .treasure-slot::after {
      content: attr(data-tooltip); box-sizing: border-box; position: absolute; left: 50%; bottom: calc(100% + 7px);
      z-index: 45; width: max-content; max-width: min(240px,calc(100vw - 44px)); padding: 8px 10px;
      border: 1px solid #48586c; border-radius: 9px; color: #fff; background: #080c12;
      box-shadow: 0 8px 24px rgba(0,0,0,.38); font-size: 11px; font-weight: 800;
      line-height: 1.5; text-align: left; white-space: pre-line; pointer-events: none; opacity: 0;
      transform: translate(-50%,5px); transition: opacity .14s ease, transform .14s ease;
    }
    .treasure-slot:nth-child(4n+1)::after { left: 0; transform: translate(0,5px); }
    .treasure-slot:nth-child(4n)::after { right: 0; left: auto; transform: translate(0,5px); }
    .treasure-slot:hover, .treasure-slot:focus-visible { border-color: #71839a; box-shadow: 0 0 0 2px rgba(255,173,61,.18); outline: none; }
    .treasure-slot:hover::after, .treasure-slot:focus-visible::after { opacity: 1; transform: translate(-50%,0); }
    .treasure-slot:nth-child(4n+1):hover::after, .treasure-slot:nth-child(4n+1):focus-visible::after,
    .treasure-slot:nth-child(4n):hover::after, .treasure-slot:nth-child(4n):focus-visible::after { transform: translate(0,0); }
    .treasure-slot[data-tooltip-open="true"]::after { opacity: 1; transform: translate(-50%,0); }
    .treasure-slot:nth-child(4n+1)[data-tooltip-open="true"]::after,
    .treasure-slot:nth-child(4n)[data-tooltip-open="true"]::after { transform: translate(0,0); }
    .treasure-slot img { width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; }
    .treasure-empty { font-size: 16px; font-weight: 900; }
    .treasure-empty-category { padding: 24px 14px; border: 1px dashed #344254; border-radius: 12px; color: var(--muted); text-align: center; font-size: 12px; font-weight: 800; }
    .passive-cards { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .passive-card { min-width: 0; padding: 14px; border: 1px solid #2d3948; border-radius: 14px; background: var(--surface-2); }
    .passive-card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .passive-card-header h3 { margin: 0; font-size: 16px; }
    .passive-description { margin: 4px 0 0; color: var(--muted); font-size: 11px; font-weight: 750; }
    .passive-current-level { color: var(--accent-text); font-size: 14px; font-weight: 950; white-space: nowrap; }
    .passive-level-controls { display: grid; gap: 8px; }
    .passive-level-row { display: grid; grid-template-columns: 78px minmax(80px,1fr) 58px; align-items: center; gap: 8px; }
    .passive-level-row label { color: #dce3ed; font-size: 11px; font-weight: 850; }
    .passive-level-row input[type="range"] { width: 100%; accent-color: var(--accent); }
    .passive-level-row input[type="number"] {
      width: 100%; min-width: 0; padding: 6px 7px; border: 1px solid #3a4859;
      border-radius: 8px; color: #fff; background: #0b1017; font-size: 12px; font-weight: 850; text-align: center; font-variant-numeric: tabular-nums;
    }
    .distance-unit-settings { display: grid; gap: 10px; margin-top: 12px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
    .distance-unit-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .distance-unit-settings-title { color: var(--muted); font-size: 13px; font-weight: 900; }
    .distance-unit-note { margin: 0; color: #aeb9c8; font-size: 11px; font-weight: 750; line-height: 1.6; }
    .distance-unit-note strong { color: var(--accent-text); }
    .distance-unit-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .distance-unit-field {
      display: grid; grid-template-columns: minmax(0,1fr) minmax(104px,132px);
      align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px;
      border: 1px solid #344253; border-radius: 10px; background: #0d141d;
      color: #dce3ed; font-size: 12px; font-weight: 850;
    }
    .distance-unit-field select {
      min-width: 0; height: 30px; padding: 4px 8px; border: 1px solid #43536a;
      border-radius: 8px; color: #f4f7fb; background: #121a24; font-size: 12px; font-weight: 850; outline: none;
    }
    .xp-clear-field {
      display: flex; align-items: center; gap: 6px; margin-top: 9px;
      color: #dce3ed; font-size: 12px; font-weight: 850; white-space: nowrap;
    }
    .xp-clear-field input {
      width: 56px; min-width: 0; height: 30px; padding: 4px; border: 1px solid #43536a; border-radius: 8px; color: #f4f7fb;
      background: #121a24; font-size: 12px; font-weight: 850; outline: none; text-align: center; font-variant-numeric: tabular-nums;
    }
    .xp-clear-field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .invasion-clear-note { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; font-weight: 700; word-break: keep-all; }

    .hero {
      position: relative; isolation: isolate; min-height: 238px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px;
      background: rgba(14,19,26,.9); box-shadow: var(--shadow);
    }
    .hero::before {
      content: ""; position: absolute; z-index: -1; inset: -3px; pointer-events: none;
      background-image: var(--stage-background, none); background-repeat: repeat-x;
      background-position: center bottom; background-size: auto var(--stage-background-height, 100%); filter: blur(2px); opacity: .5;
      -webkit-mask-image: linear-gradient(90deg,transparent 0%,transparent 18%,rgba(0,0,0,.25) 40%,#000 78%);
      mask-image: linear-gradient(90deg,transparent 0%,transparent 18%,rgba(0,0,0,.25) 40%,#000 78%);
    }
    .hero.location-hero::before {
      inset: 0; background-repeat: no-repeat; background-position: center; background-size: cover;
    }
    .zombie-location-link {
      position: absolute; right: 0; top: 0; z-index: 5; width: 164px;
      display: block; line-height: 0; cursor: pointer;
      filter: brightness(.48) saturate(.65); transition: filter .15s ease;
    }
    .zombie-location-link:hover, .zombie-location-link:focus-visible { filter: brightness(.85); }
    .zombie-location-link.is-active { filter: none; }
    .zombie-location-link:focus-visible { outline: 2px solid var(--accent-text); outline-offset: -3px; }
    .hero-copy {
      display: flex; flex-direction: column; justify-content: center; min-height: 238px; padding: 28px 38px;
    }
    .identity { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; color: var(--accent-text); font-size: 14px; font-weight: 800; letter-spacing: .13em; }
    .stage-heading { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; padding-right: 156px; }
    .map-name {
      flex: 0 0 auto; max-width: min(760px,100%); margin: 0; padding: 7px 12px;
      border: 1px solid rgba(255,173,61,.34); border-radius: 999px;
      color: var(--accent-text); background: rgba(255,173,61,.1);
      font-size: 12px; font-weight: 900; letter-spacing: -.01em; line-height: normal; white-space: nowrap;
    }
    .stage-name { margin: 0; font-family: "Yu Gothic","Malgun Gothic",sans-serif; font-size: clamp(31px,3.6vw,49px); line-height: 1.12; letter-spacing: -.045em; }
    a.map-name { text-decoration: none; white-space: normal; }
    a.map-name { transition: border-color .14s ease, transform .14s ease; }
    a.map-name:hover, a.map-name:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); }
    .map-name[hidden] { display: none; }
    .location-stages { display: grid; grid-template-columns: minmax(0,1fr); }
    .material-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-right: 18px; }
    .material-title { min-width: 0; }
    .material-title .section-title { padding-bottom: 2px; }
    .material-attempts { display: block; padding: 0 22px 14px; color: var(--muted); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .location-materials { padding: 0 18px 18px; }
    .location-material-list { gap: 10px 14px; }
    .location-material .location-magnification { color: var(--accent-text); font-weight: 800; }
    .location-material-button { position: relative; display: block; padding: 0; border: 1px solid transparent; border-radius: 8px; color: var(--text); background: transparent; outline: none; cursor: pointer; transition: border-color .14s ease, transform .14s ease; }
    .location-material-button:hover, .location-material-button:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); }
    .location-material-button::after {
      content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 7px); z-index: 30;
      padding: 7px 10px; border: 1px solid #48586c; border-radius: 9px; color: #fff; background: #080c12;
      box-shadow: 0 8px 24px rgba(0,0,0,.35); font-size: 12px; font-weight: 800; white-space: nowrap;
      opacity: 0; pointer-events: none; transform: translate(-50%,5px); transition: opacity .14s ease,transform .14s ease;
    }
    .location-material-button:hover::after, .location-material-button:focus-visible::after, .location-material-button[data-tooltip-open="true"]::after { opacity: 1; transform: translate(-50%,0); }
    .location-stage { position: relative; display: grid; grid-template-columns: minmax(130px,190px) minmax(0,1fr); align-items: center; gap: 11px; min-width: 0; min-height: 82px; padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--text); background: rgba(23,31,41,.64); }
    .location-stage:hover:not(:has(.location-enemy:hover)), .location-stage:has(.location-stage-name:focus-visible) { background: #263240; outline: none; box-shadow: inset 3px 0 var(--accent-2); }
    .location-stage-name { color: #fff; font-size: 14px; font-weight: 950; text-decoration: none; line-height: 1.35; }
    .location-stage-name::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
    .location-stage-name:focus-visible { outline: none; }
    .location-enemies { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 10px 14px; min-width: 0; }
    .location-enemy { position: relative; z-index: 1; display: flex; align-items: center; flex-direction: column; gap: 5px; min-width: 62px; color: var(--text); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .location-enemy img { display: block; width: 62px; height: 49px; object-fit: contain; }
    .location-enemy[data-boss="true"] img { filter: drop-shadow(0 0 3px rgba(255,173,61,.65)) drop-shadow(0 0 6px rgba(255,173,61,.3)); }
    .location-enemy a { display: block; border: 1px solid transparent; border-radius: 8px; background: transparent; transition: border-color .14s ease, transform .14s ease; }
    .location-enemy a:hover, .location-enemy a:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); }
    .location-magnification { text-align: center; line-height: 1.4; }
    .location-magnification .location-boss-magnification { color: var(--accent-text); }
    .location-magnification > .location-magnification-line { display: block; }
    @media (max-width:660px) {
      .material-heading { align-items: flex-start; padding: 14px 14px 10px; }
      .material-heading .section-title { padding: 0; }
      .material-attempts { padding: 3px 0 0; }
      .location-materials { padding: 0 14px 14px; }
      .location-stage { grid-template-columns: 1fr; gap: 11px; }
      .location-enemies { gap: 10px; }
      .location-enemy { min-width: 48px; }
      .location-enemy img { width: 48px; height: 40px; }
    }
    .continue-icon { display: block; position: absolute; top: 50%; right: 0; width: 140px; height: 140px; margin: 0; object-fit: contain; image-rendering: auto; transform: translateY(-50%); }
    .continue-icon[hidden] { display: none; }
    .hero-controls { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 17px; padding-top: 13px; border-top: 1px solid rgba(255,255,255,.09); }
    .hero-controls[hidden] { display: none; }
    .time-toggle { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid #364456; border-radius: 11px; background: #0d1219; }
    .time-toggle button { min-width: 62px; padding: 7px 10px; border: 0; border-radius: 8px; color: #aeb9c8; background: transparent; font-size: 12px; font-weight: 800; }
    .time-toggle button[aria-pressed="true"] { color: #fff; background: var(--accent); box-shadow: 0 4px 12px rgba(255,91,45,.22); }
    .crown-control { display: flex; align-items: center; gap: 8px; color: #dce3ed; font-size: 12px; font-weight: 900; }
    .crown-control[hidden] { display: none; }
    .crown-control select { min-width: 126px; height: 36px; padding: 5px 9px; border: 1px solid #405065; border-radius: 8px; color: #fff; background: #0b1017; font-weight: 900; }
    .content-panel { margin-top: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(15,20,28,.92); box-shadow: var(--shadow); }
    .section-title { margin: 0; padding: 19px 22px 14px; font-size: 20px; letter-spacing: -.025em; }
    .overview { display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); gap: 10px; padding: 0 14px 14px; }
    .stat-card { position: relative; align-self: start; grid-column: span 2; min-width: 0; min-height: 108px; overflow: hidden; padding: 15px 18px; border: 1px solid #2d3948; border-radius: 15px; background: var(--surface-2); }
    .overview .stat-card { align-self: stretch; }
    .stat-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: linear-gradient(var(--accent),var(--accent-2)); }
    .stat-label { display: block; color: #d9e1eb; font-size: 15px; font-weight: 800; }
    .stat-value { display: block; margin-top: 11px; overflow-wrap: anywhere; font-size: clamp(25px,2.5vw,34px); font-weight: 900; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
    .stage-difficulty-value { display: flex; align-items: baseline; gap: 0; white-space: nowrap; }
    .stage-difficulty-star { margin-right: 3px; font-size: .86em; letter-spacing: 0; }
    .stage-difficulty-decimal { margin-left: 1px; color: #d9e1eb; font-size: .66em; font-weight: 900; letter-spacing: -.02em; }
    .stage-secondary { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; padding: 0 14px 14px; }
    .stage-secondary.has-score-rewards { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
    .stage-secondary .stat-card { align-self: stretch; grid-column: auto; width: 100%; min-width: 0; }
    .stage-secondary .stat-card[hidden] { display: none; }
    .stage-rewards-card { display: grid; grid-template-columns: minmax(0,1fr); }
    .stage-info-panel, .stage-rewards-card { overflow: visible; }
    .stage-rewards-card::before { border-radius: 14px 0 0 14px; }
    .stage-rewards-card.has-score-rewards { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .stage-rewards-section { min-width: 0; }
    .stage-rewards-section[hidden] { display: none; }
    .stage-rewards-card.has-score-rewards > .stage-rewards-section:first-child { padding-right: 18px; }
    .stage-score-rewards { padding-left: 18px; border-left: 1px solid var(--line); }
    .stage-restrictions-card { display: flex; flex-direction: column; }
    .stage-restrictions-card .stage-detail-content { align-items: flex-start; margin-top: 11px; }
    .stage-castle-card { display: grid; grid-template-columns: auto minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); column-gap: 18px; }
    .stage-castle-card > .stat-label { grid-column: 1 / -1; grid-row: 1; }
    .stage-castle-image { display: block; grid-column: 1; grid-row: 2; align-self: center; width: auto; height: 132px; max-width: 92px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.34)); }
    .stage-castle-image[hidden] { display: none; }
    .stage-castle-image.enemy-castle-image { width: 128px; max-width: 128px; height: auto; }
    .range-stack { display: grid; gap: 8px; margin-top: 11px; }
    .range-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 900; }
    .range-row[hidden] { display: none; }
    .range-row strong { color: var(--text); font-size: 19px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stage-castle-card > .range-stack { align-self: center; grid-column: 2; grid-row: 2; width: 100%; margin-top: 0; }
    .stage-castle-card .range-row { flex-wrap: wrap; }
    .stage-castle-card .range-row > span, .stage-castle-card .range-row > strong { flex-shrink: 0; white-space: nowrap; }
    .stage-castle-card .range-row > strong { margin-left: auto; }
    .stage-detail-content { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 11px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { padding: 6px 9px; border: 1px solid #3c4a5b; border-radius: 8px; color: #dce3ed; background: #10161e; font-size: 11px; font-weight: 850; }
    .chip em { color: var(--accent-text); font-style: normal; }
    .stage-restriction-list { display: grid; width: 100%; align-content: start; gap: 7px; }
    .stage-restriction { display: block; color: #f4f7fb; font-size: 15px; font-weight: 800; line-height: 1.45; word-break: keep-all; overflow-wrap: normal; }
    .stage-restriction-value { color: var(--accent-text); font-style: normal; font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); font-size: 11px; font-weight: 800; }

    .stage-reward-list { display: grid; width: 100%; gap: 9px; }
    .story-reward-settings { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 11px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .story-reward-settings[hidden] { display: none; }
    .story-reward-acquired { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-width: 0; color: #d9e1eb; font-size: 12px; font-weight: 800; }
    .story-reward-acquired select { min-width: 0; max-width: 100%; height: 34px; padding: 5px 8px; border: 1px solid #405065; border-radius: 8px; color: #fff; background: #0b1017; font-weight: 800; }
    .story-reward-toggles { display: flex; align-items: center; gap: 8px; }
    .story-reward-toggle { position: relative; display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; height: 50px; padding: 3px 8px; border: 1px solid #405065; border-radius: 9px; background: #0b1017; color: var(--muted); }
    .story-reward-toggle[aria-pressed="true"] { border-color: var(--accent-text); background: rgba(255,173,61,.12); }
    .story-reward-toggle:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    .story-reward-toggle img { display: block; width: auto; height: 42px; object-fit: contain; opacity: .45; }
    .story-reward-toggle[aria-pressed="true"] img { opacity: 1; }
    .stage-reward-entry { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .stage-reward-radar { display: block; flex: 0 0 auto; width: 25px; height: 25px; margin-left: auto; object-fit: contain; image-rendering: auto; }
    .stage-reward-item { position: relative; display: block; flex: 0 0 auto; width: 54px; height: 54px; padding: 0; border: 0; color: #dce3ed; background: transparent; }
    .stage-reward-item:focus { outline: none; }
    .stage-reward-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .stage-reward-item img { display: block; width: 54px; height: 54px; object-fit: contain; image-rendering: auto; }
    .stage-reward-item img.story-treasure-image { transform: scale(.7); }
    .stage-reward-copy { display: grid; flex: 1 1 auto; min-width: 0; gap: 2px; }
    .stage-reward-copy em { min-width: 0; overflow: hidden; color: var(--accent-text); font-size: 12px; font-style: normal; font-weight: 950; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
    .stage-reward-copy small { color: var(--muted); font-size: 12px; font-weight: 800; line-height: 1.3; }
    .stage-reward-item em { color: inherit; font-style: normal; }
    .stage-reward-item::after, .story-reward-toggle::after { content: attr(data-tooltip); position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 30; width: max-content; max-width: min(330px,calc(100vw - 48px)); padding: 10px 12px; border: 1px solid #53657a; border-radius: 11px; color: #fff; background: #080c12; box-shadow: 0 12px 34px rgba(0,0,0,.48); font-size: 13px; font-weight: 900; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity .14s ease,transform .14s ease; }
    .stage-reward-item:hover::after, .stage-reward-item:focus-visible::after, .stage-reward-item[data-tooltip-open="true"]::after, .story-reward-toggle:hover::after, .story-reward-toggle:focus-visible::after { opacity: 1; transform: translateY(0); }
    .story-reward-toggle[data-tooltip-open="true"]::after { opacity: 1; transform: translateY(0); }
    .stage-reward-item::after, .story-reward-toggle::after { box-sizing: border-box; left: var(--tooltip-left, 0px); white-space: normal; overflow-wrap: anywhere; }

    .enemy-table { --enemy-identity-width: 350px; padding: 0 16px 17px; }
    .enemy-view-toggle, .enemy-compact-magnification { display: none; }
    .enemy-table-head, .enemy-row {
      display: grid; grid-template-columns: var(--enemy-identity-width) 212px minmax(70px,.5fr) minmax(95px,.65fr) minmax(200px,1.3fr);
      align-items: stretch;
    }
    .enemy-table-head { border: 1px solid #344254; border-bottom: 0; border-radius: 13px 13px 0 0; color: var(--muted); background: #111720; font-size: 13px; font-weight: 950; }
    .enemy-table-head > span { display: grid; place-items: center; min-height: 44px; padding: 8px; border-right: 1px solid #344254; text-align: center; }
    .enemy-table-head > span:first-child { grid-column: span 2; place-items: center; padding-left: 8px; }
    .enemy-table-head > span:last-child { border-right: 0; }
    .enemy-row { color: inherit; border: 1px solid #344254; border-bottom: 0; background: var(--surface-2); text-decoration: none; transition: background .13s ease, border-color .13s ease; }
    .enemy-row:hover, .enemy-row:focus-visible { position: relative; z-index: 2; border-color: #5e7188; background: #202a36; outline: none; }
    .enemy-row:last-child { border-bottom: 1px solid #344254; border-radius: 0 0 13px 13px; }
    .enemy-identity { display: grid; grid-template-columns: 62px minmax(0,1fr); align-items: center; gap: 12px; min-width: 0; padding: 8px 10px; }
    .enemy-image { display: block; width: 62px; height: 49px; overflow: visible; background: transparent; }
    .enemy-image img { display: block; width: 62px; height: 49px; object-fit: contain; image-rendering: auto; }
    .enemy-copy { display: grid; min-width: 0; gap: 2px; }
    .enemy-name { display: flex; align-items: baseline; min-width: 0; gap: 7px; font-size: 14px; font-weight: 950; white-space: nowrap; }
    .enemy-name-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .enemy-magnification { flex: 0 0 auto; color: var(--accent-text); font-size: 12px; font-weight: 950; font-variant-numeric: tabular-nums; }
    .enemy-id { color: var(--muted); font-size: 13px; font-weight: 850; letter-spacing: .03em; }
    .enemy-cell { display: grid; place-items: center; min-width: 0; min-height: 76px; padding: 9px 8px; border-right: 1px solid #344254; text-align: center; }
    .enemy-cell:last-child { border-right: 0; }
    .enemy-cell strong { color: #f4f7fb; font-size: 15px; font-weight: 950; line-height: 1.45; font-variant-numeric: tabular-nums; }
    .enemy-cell small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 800; line-height: 1.35; }
    .enemy-row[data-boss="true"] .enemy-image img { filter: drop-shadow(0 0 3px rgba(255,173,61,.65)) drop-shadow(0 0 6px rgba(255,173,61,.3)); }
    .enemy-row[data-boss="true"] .enemy-name-text, .enemy-boss-note { color: var(--accent-text); }
    .enemy-boss-note { font-size: 15px; }
    .enemy-row-error { grid-column: 1/-1; padding: 7px 12px; border-top: 1px solid #344254; color: #ff9c86; font-size: 10px; font-weight: 800; }
    .enemy-vitals { grid-column: 2; grid-row: 1; display: grid; align-content: center; gap: 8px; min-width: 0; padding: 10px 12px; border-right: 1px solid #344254; }
    .enemy-vital { display: grid; grid-template-columns: minmax(0,1fr) 88px; align-items: center; gap: 8px; color: #79bc4b; }
    .enemy-vital.attack { color: #ff5b2d; }
    .enemy-vital-bar { display: block; height: 8px; min-width: 0; overflow: hidden; border-radius: 4px; background: #d6e3ef; }
    .enemy-vital-fill { display: block; height: 100%; border-radius: inherit; background: currentColor; }
    .enemy-vital-value { min-width: 0; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .bar-settings { display: flex; align-items: center; gap: 10px; margin-top: 11px; padding-top: 11px; border-top: 1px solid rgba(255,255,255,.08); }
    .bar-settings-title { margin-right: auto; color: var(--muted); font-size: 12px; font-weight: 800; }
    .scale-field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .scale-field input[type="number"] { width: 100px; height: 35px; border: 1px solid #425267; border-radius: 10px; color: var(--text); background: #0c1118; text-align: center; font-size: 15px; font-weight: 800; outline: none; }
    .scale-field input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,91,45,.16); }
    .misc-panel .bar-settings { justify-content: flex-end; margin-top: 0; padding-top: 14px; border-top: 0; }
    .misc-panel .bar-settings-title { font-size: 13px; }
    @media (max-width: 660px) {
      .bar-settings { align-items: flex-start; flex-wrap: wrap; }
      .bar-settings-title { flex-basis: 100%; }
    }
    @media (max-width: 420px) {
      .scale-field input[type="number"] { width: 88px; }
    }

    @container treasure-card (max-width:570px) { .treasure-chapters { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @container treasure-card (max-width:410px) {
      .treasure-chapters { grid-template-columns: 1fr; }
      .treasure-chapter { display: grid; grid-template-columns: 52px minmax(0,1fr); align-items: center; gap: 8px; }
      .treasure-chapter-heading { align-items: flex-start; flex-direction: column; justify-content: center; margin: 0; }
    }
    @media (max-width: 980px) {
      .stage-secondary.has-score-rewards { grid-template-columns: minmax(0,1fr); }
      .overview { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .stat-card { grid-column: span 1; }
      .enemy-table-head { display: none; }
      .enemy-table { display: grid; gap: 9px; }
      .enemy-row { grid-template-columns: minmax(60px,.6fr) minmax(60px,.6fr) minmax(0,1.8fr); border-bottom: 1px solid #344254; border-radius: 13px; overflow: hidden; }
      .enemy-row:last-child { border-radius: 13px; }
      .enemy-identity { grid-column: 1/-1; grid-row: 1; width: var(--enemy-identity-width); border-right: 0; border-bottom: 1px solid #344254; }
      .enemy-vitals { grid-column: 1/-1; grid-row: 1; margin-left: var(--enemy-identity-width); border-right: 0; border-bottom: 1px solid #344254; padding-inline: 8px; }
      .enemy-cell { min-height: 58px; border-bottom: 1px solid #344254; }
      .enemy-cell::before { content: attr(data-label); display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 900; }
      .enemy-row > .enemy-cell { grid-column: span 1; border-bottom: 0; border-right: 1px solid #344254; }
      .enemy-row > .enemy-cell:nth-child(4) { border-right: 0; }
      .enemy-row-error { grid-column: 1/-1; }
    }
    @media (max-width: 660px) {
      .stage-rewards-card.has-score-rewards { padding-inline: 12px; }
      .stage-rewards-card.has-score-rewards > .stage-rewards-section:first-child { padding-right: 10px; }
      .stage-score-rewards { padding-left: 10px; }
      .page { width: min(100% - 20px,1220px); padding-top: 12px; }
      .db-toolbar { align-items: stretch; flex-direction: column; gap: 10px; padding: 13px 15px; }
      .unit-search { grid-template-columns: 72px minmax(0,1fr) 58px; gap: 7px; }
      .unit-search button[type="submit"] { padding-inline: 8px; }
      .unit-search-results { width: min(360px, calc(100vw - 106px)); }
      .treasure-settings summary, .misc-settings summary { flex-wrap: wrap; padding-inline: 15px; }
      .treasure-panel, .misc-panel { padding-inline: 15px; }
      .treasure-cards, .passive-cards { grid-template-columns: 1fr; }
      .treasure-card-header { grid-template-columns: 122px minmax(0,1fr) auto; }
      .treasure-effect-image { width: 122px; height: 48px; }
      .treasure-slots { grid-template-columns: repeat(4,38px); gap: 4px; }
      .treasure-slot { width: 38px; height: 38px; }
      .treasure-slot img { width: 34px; height: 34px; }
      .hero-copy { padding: 20px 16px; }
      .stage-name { font-size: clamp(22px,6vw,32px); }
      .stage-heading { padding-right: 125px; }
      .continue-icon { width: 115px; height: 115px; }
      .overview { grid-template-columns: repeat(2,minmax(0,1fr)); padding-inline: 10px; }
      .stage-secondary { padding-inline: 10px; }
      .section-title { padding-inline: 14px; }
      .enemy-table { --enemy-identity-width: 327px; padding-inline: 10px; }
      .enemy-row { grid-template-columns: minmax(60px,.6fr) minmax(60px,.6fr) minmax(0,1.8fr); }
      .enemy-identity { grid-template-columns: 48px minmax(0,1fr); gap: 7px; padding-inline: 8px; }
      .enemy-image, .enemy-image img { width: 48px; height: 40px; }
      .enemy-name { flex-wrap: wrap; gap: 2px 5px; }
      .enemy-vital { gap: 5px; }
      .enemy-row > .enemy-cell { grid-column: span 1; border-bottom: 0; border-right: 1px solid #344254; }
      .enemy-row > .enemy-cell:nth-child(4) { border-right: 0; }
    }
    @media (max-width: 620px) {
      .distance-unit-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 400px) {
      .enemy-identity { width: 100%; grid-template-columns: 48px 256px; }
      .enemy-vitals { grid-row: 2; margin-left: 0; }
    }
    @media (max-width: 980px) {
      .enemy-view-toggle { display: flex; flex-shrink: 0; }
      .enemy-table[data-view="compact"] { display: block; overflow-x: auto; }
      .enemy-table[data-view="compact"] .enemy-table-head,
      .enemy-table[data-view="compact"] .enemy-row {
        display: grid;
        grid-template-columns: 92px clamp(74px,13vw,128px) clamp(90px,17vw,166px) minmax(220px,1fr);
        min-width: 476px;
      }
      .enemy-table[data-view="compact"] .enemy-table-head > span:first-child { grid-column: span 1; }
      .enemy-table[data-view="compact"] .enemy-row { border-bottom: 0; border-radius: 0; }
      .enemy-table[data-view="compact"] .enemy-row:last-child { border-bottom: 1px solid #344254; border-radius: 0 0 13px 13px; }
      .enemy-table[data-view="compact"] .enemy-identity { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px; width: auto; border-bottom: 0; border-right: 1px solid #344254; }
      .enemy-table[data-view="compact"] .enemy-copy,
      .enemy-table[data-view="compact"] .enemy-vitals { display: none; }
      .enemy-table[data-view="compact"] .enemy-compact-magnification { display: block; color: var(--text); font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.4; overflow-wrap: anywhere; }
      .enemy-table[data-view="compact"] .enemy-row[data-boss="true"] .enemy-compact-magnification { color: var(--accent-text); }
      .enemy-table[data-view="compact"] .enemy-cell { min-height: 76px; }
      .enemy-table[data-view="compact"] .enemy-cell::before { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="db-toolbar">
      <a class="db-brand" id="homeLink" href="#" aria-label="냥코DB 홈">냥코<span>DB</span></a>
      <form class="unit-search" id="unitSearchForm" role="search">
        <label for="unitSearchInput">검색</label>
        <div class="unit-search-field">
          <input id="unitSearchInput" type="search" autocomplete="off" spellcheck="false"
                 placeholder="이름 입력" aria-label="이름 검색" aria-autocomplete="list"
                 aria-controls="unitSearchResults" aria-expanded="false">
          <div class="unit-search-results" id="unitSearchResults" role="listbox" aria-label="이름 검색 결과" hidden></div>
        </div>
        <button type="submit">검색</button>
      </form>
    </header>

    <details class="treasure-settings" id="treasureSettings">
      <summary>
        <span>보물/패시브 설정</span>
        <span class="treasure-summary-actions">
          <button class="treasure-action-button" id="treasureResetButton" type="button" disabled>초기화</button>
          <span class="settings-toggle-control"><span id="treasureToggleLabel">펼치기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span>
        </span>
      </summary>
      <div class="treasure-panel">
        <div class="treasure-category-tabs" id="treasureCategoryTabs" role="group" aria-label="보물 및 패시브 종류"></div>
        <p class="treasure-note" id="treasureNote">보물 칸을 누르면 없음 → 조잡한 → 평범한 → 최고급 순으로 변경됩니다.</p>
        <div id="treasureCategoryContent"></div>
      </div>
    </details>

    <details class="misc-settings" id="miscSettings">
      <summary>
        <span>기타 설정</span>
        <span class="misc-summary-actions"><span class="settings-toggle-control"><span id="miscToggleLabel">펼치기</span><span class="settings-toggle-arrow" aria-hidden="true">▾</span></span></span>
      </summary>
      <div class="misc-panel">
        <div class="bar-settings" aria-label="스탯 바 기준값 설정">
          <span class="bar-settings-title">바 기준값</span>
          <label class="scale-field">체력 <input class="number" id="enemyHpBarMax" type="number" inputmode="numeric" min="1" step="1000" aria-label="체력 바 최댓값"></label>
          <label class="scale-field">공격력 <input class="number" id="enemyAttackBarMax" type="number" inputmode="numeric" min="1" step="1000" aria-label="공격력 바 최댓값"></label>
        </div>
        <section class="distance-unit-settings" aria-labelledby="distanceUnitSettingsTitle">
          <div class="distance-unit-heading">
            <span class="distance-unit-settings-title" id="distanceUnitSettingsTitle">거리 단위 설정</span>
            <button class="distance-unit-reset" id="distanceUnitResetButton" type="button" disabled>초기화</button>
          </div>

    function clearAdjustedBaseXp() {

    function renderRestrictions() {

      const factor = Number(crownOptions[state.crownIndex] || 100) / 100;

    function enemyTreasureMultiplier(row) {
      const traits = row.mechanicTraits || [];
      const total = (key) => (treasureState.get(key) || []).reduce((sum, slots) => sum + chapterPercent(slots), 0);
      const god = traits.find((trait) => trait.key === "cat_god");
      if (god) {

        const percent = chapterPercent(treasureState.get("mysterious_mask")?.[chapter] || []);

        if (!map) return;
        hero.classList.add("location-hero");
        path = `img/map/${map}.png`;
      } else {
        const id = DATA.stageInfo?.backgroundImageId ?? DATA.stageInfo?.backgroundId;
        if (id === null || id === undefined || !Number.isInteger(Number(id)) || Number(id) < 0) return;
        path = `img/bg/bg${String(Number(id)).padStart(3, "0")}.png`;
      }
      const image = new Image();
      image.onload = () => {
        // Scale against a 512px viewport and align the bottom: any extra sky
        // is cropped off the top without modifying the original image file.
        if (!isLocation) hero.style.setProperty("--stage-background-height", `${Math.max(1, image.naturalHeight / 512) * 100}%`);
        hero.style.setProperty("--stage-background", `url("${image.src}")`);
      };
      // The hero keeps its original dark surface until a matching image loads.
      image.src = assetPath(path);
    }

    function initialize() {
      initializeStageBackground();
      // Keep the original CSS descriptions; explicit tap state also works without hover or keyboard focus.
      const placeRewardTooltip = (item) => {
        if (!item?.matches(".stage-reward-item, .story-reward-toggle")) return;
        const zoom = Number.parseFloat(getComputedStyle(document.body).zoom) || 1;
        const width = Number.parseFloat(getComputedStyle(item, "::after").width) * zoom;
        const rect = item.getBoundingClientRect();
        const left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
        item.style.setProperty("--tooltip-left", `${(left - rect.left) / zoom}px`);
      };
      document.addEventListener("pointerover", (event) => placeRewardTooltip(event.target.closest("[data-tooltip]")));
      document.addEventListener("focusin", (event) => placeRewardTooltip(event.target.closest("[data-tooltip]")));
      document.addEventListener("pointerdown", (event) => closeRewardTooltips(event.target.closest("[data-tooltip]")));
      document.addEventListener("click", (event) => {
        const item = event.target.closest(".stage-reward-item, .story-reward-toggle");
        if (!item) return;
        if (!item.matches("button.stage-reward-item")) { closeRewardTooltips(item); item.dataset.tooltipOpen = "true"; }
        placeRewardTooltip(item);
      });
      window.addEventListener("resize", () => document.querySelectorAll('[data-tooltip-open="true"], .stage-reward-item:hover, .story-reward-toggle:hover').forEach(placeRewardTooltip));
      $("homeLink").href = SITE_PREFIX + "index.html";
      const displayedStageId = !isLocation ? stageId
        : /^Space\d+$/i.test(stageId) ? `Space${stageId.slice(5)}`
        : stageId.toLowerCase() === "eoc" ? "EoC"
        : stageId.toUpperCase();
      $("stageId").textContent = `STAGE ${displayedStageId}`;
      const stageName = String(stage.name || stageId).trim();
      renderStageClassification();
      $("stageName").textContent = stageName;
      $("continueIcon").hidden = !Boolean(stage.noContinues);
      restoreSharedSettings(); restorePreviousClearCount(); restoreStoryRewardStates(); restoreLocationLevel(); restorePanels();
      renderStageClassification();
      $("mapName").addEventListener("click", persistLocationLevel);
      $("locationStages")?.addEventListener("click", (event) => {
        if (event.target.closest(".location-stage-name")) persistLocationLevel();
      });
      persistEnemyTreasureState();
      const syncEnemyBarInputs = () => { if ($("enemyHpBarMax")) $("enemyHpBarMax").value = state.hpBarMax; if ($("enemyAttackBarMax")) $("enemyAttackBarMax").value = state.attackBarMax; };
      syncEnemyBarInputs();
      for (const [id, key] of [["enemyHpBarMax", "hpBarMax"], ["enemyAttackBarMax", "attackBarMax"]]) {
        const input = $(id);
        if (!input) continue;
        input.addEventListener("input", () => {
          if (input.value === "") return;
          state[key] = clampInteger(input.value, 1, 1e12, state[key]);
          persistSharedSettings(); syncResetButtons(); renderEnemies();
        });
        input.addEventListener("change", () => { input.value = state[key]; });
      }
      const restoreSharedView = () => {
        restoreSharedSettings(); syncEnemyBarInputs(); syncDistanceUnitInputs();
        restoreStoryRewardStates(false); restorePreviousClearCount(); $("crownSelect").value = isInvasion && !isZombie ? state.invasionLocationId : String(state.crownIndex); renderStageClassification();
        renderTreasureTabs(); renderTreasureContent(); syncResetButtons(); renderOverview(); renderRewards(); renderRestrictions(); renderEnemies();
      };
      window.addEventListener("pageshow", (event) => { if (event.persisted) restoreSharedView(); });
      window.addEventListener("storage", (event) => { if ([sharedSettingsStorageKey, enemySharedSettingsKey, locationLevelStorageKey, clearCountStorageKey, invasionLocationStorageKey, storyRewardStorageKey, null].includes(event.key) || (isInvasion && event.key === locationClearCountKey(state.invasionLocationId))) restoreSharedView(); });
      syncDistanceUnitInputs();
      $("crownSelect").innerHTML = crownOptions.map((value,index) => `<option value="${index}">${DATA.story ? `제${DATA.story.chapters[index].chapter}장` : DATA.location?.chapters?.length ? `제${DATA.location.chapters[index]}장` : `👑${index + 1} · ${fmtNumber(value)}%`}</option>`).join("");
      $("crownSelect").closest(".crown-control").hidden = stage.showStageLevel === false || Boolean(DATA.story && (DATA.story.family !== 0 || DATA.story.stageIndex === 47));
      $("crownSelect").value = String(state.crownIndex);
      if (isInvasion && !isZombie) {
        $("stageLevelLabel").textContent = "습격 위치";
        $("crownSelect").closest(".crown-control").hidden = false;
        $("crownSelect").innerHTML = invasionLocations.map(({id, name}) => `<option value="${escapeHtml(id)}">${escapeHtml(name)}</option>`).join("");
        $("crownSelect").value = state.invasionLocationId;
      }
      const syncTimeButtons = () => { $("timeSeconds")?.setAttribute("aria-pressed", String(state.timeUnit === "seconds")); $("timeFrames")?.setAttribute("aria-pressed", String(state.timeUnit === "frames")); };
      $("timeSeconds")?.addEventListener("click", () => { state.timeUnit = "seconds"; syncTimeButtons(); renderOverview(); renderEnemies(); });
      $("timeFrames")?.addEventListener("click", () => { state.timeUnit = "frames"; syncTimeButtons(); renderOverview(); renderEnemies(); });
      $("materialProbability")?.addEventListener("click", () => { state.materialMetric = "probability"; renderLocationMaterials(); });
      $("materialExpected")?.addEventListener("click", () => { state.materialMetric = "expected"; renderLocationMaterials(); });
      $("enemyCompact")?.addEventListener("click", () => { state.enemyView = "compact"; persistSharedSettings(); renderEnemies(); });
      $("enemyDetailed")?.addEventListener("click", () => { state.enemyView = "detail"; persistSharedSettings(); renderEnemies(); });
      $("crownSelect").addEventListener("change", (event) => {
        if (isInvasion) { selectInvasionLocation(event.target.value); renderOverview(); return; }
        state.crownIndex = clampInteger(event.target.value, 0, crownOptions.length - 1, 0); persistLocationLevel(); persistStoryRewardStates(); renderStageClassification(); renderOverview(); renderRewards(); renderRestrictions(); renderEnemies();
      });
      $("rewardQualitySelect")?.addEventListener("change", (event) => { restoreStoryRewardStates(false); currentStoryRewardState().quality = clampInteger(event.target.value, 0, 3, 0); persistStoryRewardStates(); renderRewards(); });
      $("zombieClearToggle")?.addEventListener("click", toggleZombieClear);
      $("treasureChanceToggle")?.addEventListener("click", () => { restoreStoryRewardStates(false); const acquired = currentStoryRewardState(); acquired.treasureChance = !acquired.treasureChance; persistStoryRewardStates(); renderRewards(); });
      $("treasureSettings").addEventListener("toggle", persistPanels);
      $("miscSettings")?.addEventListener("toggle", persistPanels);
      $("treasureResetButton").addEventListener("click", (event) => {
        event.preventDefault(); event.stopPropagation();
        treasureState.forEach((chapters) => chapters.forEach((slots) => slots.fill(3)));
        if (DATA.treasures?.passive) { state.study.baseLevel = Number(passive.maxBaseLevel || 20); state.study.plusLevel = Number(passive.maxPlusLevel || 10); }
        persistSharedSettings(); renderTreasureContent(); syncResetButtons(); renderOverview(); renderEnemies();
      });
      $("stageLengthUnitSelect")?.addEventListener("change", (event) => { state.stageLengthUnit = event.target.value; persistSharedSettings(); syncResetButtons(); renderOverview(); });
      $("bossSpawnUnitSelect")?.addEventListener("change", (event) => { state.bossSpawnUnit = event.target.value; persistSharedSettings(); syncResetButtons(); renderOverview(); });
      $("distanceUnitResetButton")?.addEventListener("click", () => { state.stageLengthUnit = "rng"; state.bossSpawnUnit = "rng"; syncDistanceUnitInputs(); persistSharedSettings(); syncResetButtons(); renderOverview(); });
      $("overview")?.addEventListener("input", (event) => {
        if (event.target.id !== "previousClearCount") return;
        setPreviousClearCount(event.target.value);
        if (event.target.value !== String(state.previousClearCount)) event.target.value = String(state.previousClearCount);
        $("stageXpValue").textContent = stageXpText(); renderCastleImage(DATA.stageInfo || {});
        if (isInvasion) $("invasionClearNote").innerHTML = invasionClearNote();
        if (isZombie) renderRewards();
      });
      document.addEventListener("pointerdown", (event) => { if (!$("rewards")?.contains(event.target) && !$("scoreRewards")?.contains(event.target)) closeRewardTooltips(); });
      document.addEventListener("pointerdown", (event) => { if (!$("locationMaterials")?.contains(event.target)) closeMaterialTooltips(); });
      syncTimeButtons(); renderTreasureTabs(); renderTreasureContent(); syncResetButtons(); renderOverview(); renderRewards(); renderRestrictions(); renderEnemies();
    }
    initialize();
  </script>
</body>
</html>
