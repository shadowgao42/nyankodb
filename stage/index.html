<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>스테이지 검색 · 냥코DB</title>
  <style>
    :root {
      --bg: #080b10;
      --line: #293645;
      --text: #f4f7fb;
      --muted: #94a2b6;
      --accent: #ff5b2d;
      --accent-2: #ffad3d;
      --accent-text: #ffad3d;
      --shadow: 0 24px 70px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 143vh;
      margin: 0;
      overflow-x: hidden;
      zoom: .7;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 74, 32, .18), transparent 30rem),
        repeating-linear-gradient(45deg, transparent 0 70px, rgba(255,255,255,.03) 71px 72px),
        linear-gradient(180deg, #10151d 0%, var(--bg) 62%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .page {
      display: flex;
      flex-direction: column;
      width: min(1220px, calc(100% - 36px));
      min-height: 143vh;
      margin: 0 auto;
      padding: 24px 0 38px;
    }
    .search-panel, .filter-panel, .results-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(14, 19, 26, .94);
      box-shadow: var(--shadow);
    }
    .search-panel { padding: 18px; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(22px, 3vw, 29px); letter-spacing: -.045em; }
    h2 { font-size: 18px; letter-spacing: -.035em; }
    .search-description, .result-status { color: var(--muted); font-size: 13px; }
    .search-description { margin-top: 6px; font-weight: 800; }
    .result-status { flex-shrink: 0; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
    .search-controls { margin-top: 16px; }
    .search-input {
      width: 100%;
      height: 42px;
      padding: 8px 13px;
      border: 1px solid #4d5a69;
      border-radius: 9px;
      color: var(--text);
      background: #0c1118;
      outline: none;
    }
    .search-input:focus { border-color: #788697; box-shadow: 0 0 0 2px rgba(145,158,173,.18); }
    .filter-panel > .section-heading {
      padding: 13px 15px;
      border-bottom: 1px solid var(--line);
    }
    .filter-panel.is-collapsed > .section-heading { border-bottom: 0; }
    .filter-collapse {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0;
      border: 0;
      color: #dce3ed;
      background: transparent;
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-collapse:hover, .filter-collapse:focus-visible { color: #fff; outline: none; }
    .filter-collapse-arrow {
      color: var(--accent-2);
      font-size: 22px;
      line-height: .8;
      transition: transform .16s ease;
    }
    .filter-panel:not(.is-collapsed) .filter-collapse-arrow { transform: rotate(180deg); }
    .filter-body { padding: 15px; }
    .filter-placeholder { color: var(--muted); font-size: 13px; font-weight: 800; }
    .results-panel {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      flex-direction: column;
    }
    .results-panel > .section-heading {
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .results-title-actions { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .results-title-actions { flex-shrink: 0; }
    #toggleAllStages[aria-expanded="true"] .filter-collapse-arrow { transform: rotate(180deg); }
    #toggleAllStages:disabled { opacity: .5; cursor: default; }
    .results-scroll {
      flex: 1 1 0;
      min-height: 180px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #526174 #111720;
    }
    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 1220px); padding-top: 12px; }
      .search-panel { padding: 15px; }
      .results-panel > .section-heading { padding-inline: 15px; }
    }
    @media (max-width: 500px) {
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .results-panel > .section-heading { align-items: center; flex-direction: row; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
  <link rel="stylesheet" href="../gnb.css">
  <link rel="stylesheet" href="../stage-list.css">
  <link rel="stylesheet" href="../stage-filters.css">
</head>
<body>
  <main class="page">
    <header data-nyanko-gnb data-search-prefix="unitSearch" data-search-placeholder="이름 입력"></header>
    <script src="../gnb.js"></script>

    <section class="search-panel" aria-labelledby="searchTitle">
      <div class="section-heading">
        <div>
          <h1 id="searchTitle">스테이지 검색</h1>
          <p class="search-description">이름 또는 ID로 원하는 스테이지를 찾을 수 있습니다.</p>
        </div>
      </div>
      <div class="search-controls">
        <input class="search-input" id="nameSearch" type="search" autocomplete="off"
               spellcheck="false" placeholder="스테이지 이름 또는 ID 입력" aria-label="스테이지 이름 또는 ID 검색">
      </div>
    </section>

    <section class="filter-panel is-collapsed" aria-labelledby="filterTitle">
      <div class="section-heading">
        <h2 id="filterTitle">검색 필터</h2>
        <div class="filter-actions">
          <button class="reset-button" id="resetFilters" type="button" disabled>초기화</button>
          <button class="filter-collapse" id="filterCollapse" type="button" aria-expanded="false" aria-controls="filterBody">
            <span id="filterCollapseText">펼치기</span><span class="filter-collapse-arrow" aria-hidden="true">▾</span>
          </button>
        </div>
      </div>
      <div class="filter-body" id="filterBody" hidden>
        <div class="filter-group">
          <h3 class="filter-label" id="stageCategoryLabel">스테이지 분류</h3>
          <div class="filter-chip-list" id="stageCategoryFilters" role="group" aria-labelledby="stageCategoryLabel"></div>
        </div>
        <div class="filter-group">
          <h3 class="filter-label" id="stageEnemyLabel">출현 적</h3>
          <div class="stage-filter-picker">
            <div class="stage-filter-field">
              <input class="search-input" id="stageEnemySearch" type="search" role="combobox" autocomplete="off" spellcheck="false" placeholder="적 이름 또는 ID 입력" aria-labelledby="stageEnemyLabel" aria-autocomplete="list" aria-expanded="false" aria-controls="stageEnemyOptions">
              <div class="unit-search-results" id="stageEnemyOptions" role="listbox" aria-label="추가할 적" hidden></div>
            </div>
            <div class="filter-chip-list stage-selected-list" id="stageEnemySelected" aria-live="polite"></div>
          </div>
        </div>
        <div class="filter-group">
          <h3 class="filter-label" id="stageRewardLabel">보상</h3>
          <div class="stage-filter-picker">
            <div class="stage-filter-field">
              <input class="search-input" id="stageRewardSearch" type="search" role="combobox" autocomplete="off" spellcheck="false" placeholder="보상 이름 또는 ID 입력" aria-labelledby="stageRewardLabel" aria-autocomplete="list" aria-expanded="false" aria-controls="stageRewardOptions">
              <div class="unit-search-results" id="stageRewardOptions" role="listbox" aria-label="추가할 보상" hidden></div>
            </div>
            <div class="filter-chip-list stage-selected-list" id="stageRewardSelected" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="results-panel" aria-labelledby="resultsTitle">
      <div class="section-heading">
        <h2 id="resultsTitle">스테이지 목록</h2>
        <div class="results-title-actions">
          <p class="result-status" id="resultStatus" aria-live="polite">스테이지 목록을 불러오는 중입니다.</p>
          <button class="filter-collapse" id="toggleAllStages" type="button" aria-expanded="false" aria-controls="stageResults" aria-label="모든 항목 펼치기">
            <span class="stage-toggle-all-label">펼치기</span><span class="filter-collapse-arrow" aria-hidden="true">▾</span>
          </button>
        </div>
      </div>
      <div class="results-scroll" id="resultsScroll" tabindex="0" aria-label="장 및 스테이지 검색 결과">
        <div id="stageResults" class="stage-list"></div>
      </div>
    </section>
  </main>

  <script src="../catalog.js"></script>
  <script src="../search.js" data-stage-search defer></script>
  <script src="../stage-list.js" defer></script>
  <script src="../stage-filter-data.js" defer></script>
  <script src="../stage-filters.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filterPanel = document.querySelector(".filter-panel");
      const filterCollapse = document.getElementById("filterCollapse");
      filterCollapse.addEventListener("click", () => {
        const collapsed = filterPanel.classList.toggle("is-collapsed");
        document.getElementById("filterBody").hidden = collapsed;
        filterCollapse.setAttribute("aria-expanded", String(!collapsed));
        document.getElementById("filterCollapseText").textContent = collapsed ? "펼치기" : "접기";
      });
      const filters = window.NyankoStageFilters.mount({
        root: document.getElementById("filterBody"), catalog: window.NYANKODB_SEARCH_CATALOG,
        data: window.NYANKODB_STAGE_FILTER_DATA,
        reset: document.getElementById("resetFilters"), nameInput: document.getElementById("nameSearch"),
      });
      const list = window.NyankoStageList.mount({
        catalog: window.NYANKODB_SEARCH_CATALOG,
        input: document.getElementById("nameSearch"),
        results: document.getElementById("stageResults"),
        status: document.getElementById("resultStatus"),
        scroll: document.getElementById("resultsScroll"),
        getFilter: filters.getFilter,
        toggleAll: document.getElementById("toggleAllStages"),
      });
      document.getElementById("filterBody").addEventListener("stagefilterschange", list.refresh);
      const panel = document.querySelector(".results-panel");
      const initialHeight = panel.offsetHeight;
      if (initialHeight > 0) { panel.style.height = `${initialHeight}px`; panel.style.flex = "0 0 auto"; }
    }, { once: true });
  </script>
</body>
</html>
