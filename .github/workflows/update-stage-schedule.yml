name: Diagnose Japanese pack inputs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-kr-stage-schedule
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public schedule input
        env:
          PONOS_EVENT_AUTH: ${{ secrets.PONOS_EVENT_AUTH }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          import hashlib,json,os,sys,time
          sys.path.insert(0,'.github/scripts')
          import update_stage_schedule as stage
          import update_sale_schedule as sale
          auth=json.loads(os.environ['PONOS_EVENT_AUTH'])
          for resource in ['item.tsv','sale.tsv']:
              for attempt in range(3):
                  try:
                      content,headers=stage.fetch_sale(auth,region='jp',resource=resource)
                      break
                  except stage.ScheduleError:
                      if attempt==2: raise
                      time.sleep(2)
              assert content.startswith(b'[start]') and b'?jwt=' not in content
              Path(os.environ['RUNNER_TEMP'], 'diagnostic-'+resource).write_bytes(content)
              print('SOURCE',resource,'version',stage.REGIONS['jp']['gameVersion'],'sha256',hashlib.sha256(content).hexdigest(),'lastModified',headers.get('Last-Modified'))
              records=sale.parse_items(content) if resource=='item.tsv' else stage.parse_sale(content)
              print('RECORDS',resource,len(records))
              for r in records:
                  matched=(800<=r['itemId']<900 or r['itemId'] in (50000,50001) or r['categoryId'] in (50000,50001)) if resource=='item.tsv' else any(i>=50000 for i in r['mapIds'])
                  if matched:
                      print('ROW',json.dumps({k:stage.iso(v) if k in ('start','end') else v for k,v in r.items()},ensure_ascii=False))
              if resource=='item.tsv':
                  feed=sale.make_feed(content,'jp',datetime.now(stage.KST),json.loads(sale.CATALOG.read_text('utf-8')),json.loads(sale.GACHA_CATALOG.read_text('utf-8')))
                  print('PACK_FEED',json.dumps([{k:e.get(k) for k in ('itemId','categoryId','start','end','permanent')} for e in feed['events'] if e['kind']=='pack'],ensure_ascii=False))
          
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-public-inputs
          path: ${{ runner.temp }}/diagnostic-*.tsv
          retention-days: 1
