name: Update official stage schedules

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      delay_refresh:
        type: boolean
        default: false
    secrets:
      PONOS_EVENT_AUTH:
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stage-schedule.yml'
      - '.github/workflows/stage-schedule-timer.yml'
      - '.github/scripts/update_stage_schedule.py'
      - '.github/scripts/publish_stage_schedule.py'
      - '.github/scripts/update_gacha_schedule.py'
      - '.github/scripts/gacha_discounts.py'
      - '.github/gacha-catalog.json'
      - '.github/stage-schedule-maps.json'

permissions:
  contents: write

concurrency:
  group: official-kr-stage-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.delay_refresh && 'official-kr-stage-schedule-5min' || 'official-kr-stage-schedule-direct' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch directly from PONOS
        id: collect
        env:
          PONOS_EVENT_AUTH: ${{ secrets.PONOS_EVENT_AUTH }}
        run: |
          # Each command authenticates the shared reader. Avoid overlapping token renewals.
          if python .github/scripts/update_stage_schedule.py --region kr --output "$RUNNER_TEMP/stage-schedule-kr.json"; then
            echo "kr_ok=true" >> "$GITHUB_OUTPUT"
          fi
          if python .github/scripts/update_stage_schedule.py --region jp --output "$RUNNER_TEMP/stage-schedule-jp.json"; then
            echo "jp_ok=true" >> "$GITHUB_OUTPUT"
          fi
          if python .github/scripts/update_gacha_schedule.py --region kr --output "$RUNNER_TEMP/gacha-schedule-kr.json"; then
            echo "gacha_kr_ok=true" >> "$GITHUB_OUTPUT"
          fi
          if python .github/scripts/update_gacha_schedule.py --region jp --output "$RUNNER_TEMP/gacha-schedule-jp.json"; then
            echo "gacha_jp_ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Korean calendar JSON on the data branch
        if: ${{ steps.collect.outputs.kr_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_stage_schedule.py "$RUNNER_TEMP/stage-schedule-kr.json"
      - name: Publish Japanese calendar JSON on the data branch
        if: ${{ always() && steps.collect.outputs.jp_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_stage_schedule.py "$RUNNER_TEMP/stage-schedule-jp.json"
      - name: Publish Korean gacha JSON on the data branch
        if: ${{ always() && steps.collect.outputs.gacha_kr_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_stage_schedule.py "$RUNNER_TEMP/gacha-schedule-kr.json"
      - name: Publish Japanese gacha JSON on the data branch
        if: ${{ always() && steps.collect.outputs.gacha_jp_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_stage_schedule.py "$RUNNER_TEMP/gacha-schedule-jp.json"
      - name: Check all four collections
        if: ${{ always() && (steps.collect.outputs.kr_ok != 'true' || steps.collect.outputs.jp_ok != 'true' || steps.collect.outputs.gacha_kr_ok != 'true' || steps.collect.outputs.gacha_jp_ok != 'true') }}
        run: exit 1
