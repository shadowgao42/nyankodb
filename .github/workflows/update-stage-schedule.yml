name: Update official KR stage schedule

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      delay_refresh:
        type: boolean
        default: false
    secrets:
      PONOS_EVENT_AUTH:
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-stage-schedule.yml'
      - '.github/workflows/stage-schedule-timer.yml'
      - '.github/scripts/update_stage_schedule.py'
      - '.github/scripts/publish_stage_schedule.py'
      - '.github/stage-schedule-maps.json'

permissions:
  contents: write

concurrency:
  group: official-kr-stage-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.delay_refresh && 'official-kr-stage-schedule-5min' || 'official-kr-stage-schedule-direct' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch directly from PONOS
        env:
          PONOS_EVENT_AUTH: ${{ secrets.PONOS_EVENT_AUTH }}
        run: python .github/scripts/update_stage_schedule.py --output "$RUNNER_TEMP/stage-schedule-kr.json"
      - name: Publish only the calendar JSON on the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_stage_schedule.py "$RUNNER_TEMP/stage-schedule-kr.json"
